ngth ('descant on'); a soaring melody above the tune","c":[["decant","to pour off (wine) gently; to transfer"]],"e":["He descanted on the fall of Rome; decant the Bordeaux."],"h":"deSCANT = SING over (cantare); deCANT = pour from CANTeen.","t":"高谈阔论;高音部","et":"他就罗马的衰亡高谈阔论;把那瓶波尔多滤醒一下。","lang":"en","cat":"cf","id":"cf-descant"},{"w":"exculpate","p":"EK-skul-pate","d":"to clear from blame","c":[["exonerate","≈ exculpate (officially absolve)"],["inculpate","to accuse, incriminate"]],"e":["The footage exculpated the driver."],"h":"culpa = guilt: EX-culpate takes guilt out, IN-culpate puts it in.","t":"开脱罪责","et":"那段录像为司机开脱了责任。","lang":"en","cat":"cf","id":"cf-exculpate"},{"w":"suborn","p":"suh-BORN","d":"to bribe or induce (someone) to do wrong, esp. commit perjury","c":[["subvert","to undermine from within"],["adorn","to decorate"]],"e":["He was charged with suborning witnesses."],"h":"SUB-orn = secretly equip someone for crime.","t":"收买(作伪证)","et":"他被控收买证人作伪证。","lang":"en","cat":"cf","id":"cf-suborn"},{"w":"asperse","p":"uh-SPURSS","d":"to slander (usu. as 'cast aspersions')","c":[["disperse","to scatter"],["aspire","to aim high"]],"e":["They cast aspersions on her scholarship."],"h":"aspersion = sprinkling (dirty water on a name).","t":"诽谤中伤","et":"他们对她的学术造诣大加诽谤。","lang":"en","cat":"cf","id":"cf-asperse"},{"w":"animadvert","p":"an-ih-mad-VURT","d":"to criticize, remark censoriously ('animadvert on')","c":[["advert (v.)","to refer to ('advert to the case')"],["avert","to prevent, turn away"]],"e":["The review animadverted on the book's sloppy notes."],"h":"animus (mind) + advert (turn to) = turn your mind against.","t":"指摘抨击","et":"这篇书评指摘了该书注释的草率。","lang":"en","cat":"cf","id":"cf-animadvert"},{"w":"objurgate","p":"OB-jur-gate","d":"to berate harshly, chide","c":[["abjure","to renounce"],["adjudicate","to judge a dispute"]],"e":["The coach objurgated the defense at halftime."],"h":"OB-jur-gate: OBject with JURidical fury.","t":"痛斥","et":"中场休息时教练痛斥了后防线。","lang":"en","cat":"cf","id":"cf-objurgate"},{"w":"expostulate","p":"ik-SPOS-chuh-late","d":"to reason earnestly with someone in protest","c":[["expatiate","to speak at length"],["postulate","to assume as premise"]],"e":["Friends expostulated with him about the risk."],"h":"ex-POSTULate = demand (postulare) someone reconsider.","t":"规劝告诫","et":"朋友们就其中的风险与他苦口相劝。","lang":"en","cat":"cf","id":"cf-expostulate"},{"w":"remonstrate","p":"rih-MON-strate","d":"to protest, argue in objection ('remonstrate with')","c":[["demonstrate","to show, prove"]],"e":["She remonstrated with the referee."],"h":"RE-monstrate = show back — push your objection at them.","t":"抗议;力劝","et":"她向裁判提出抗议。","lang":"en","cat":"cf","id":"cf-remonstrate"},{"w":"descry","p":"dih-SKRY","d":"to catch sight of from afar; to detect","c":[["decry","to denounce"],["describe","to give an account of"]],"e":["At dawn we descried the coast."],"h":"deScry = eSpy.","t":"远远望见","et":"黎明时我们远远望见了海岸。","lang":"en","cat":"cf","id":"cf-descry"},{"w":"arrogate","p":"AIR-uh-gate","d":"to seize or claim without right ('arrogate to oneself')","c":[["abrogate","to repeal (a law)"],["aggregate","to collect into a whole"]],"e":["The office arrogated to itself the power of review."],"h":"ARROgate = ARROgant grab.","t":"僭取;妄称","et":"该部门擅自把审查权揽到自己手里。","lang":"en","cat":"cf","id":"cf-arrogate"},{"w":"hieroglyph","p":"HY-ruh-glif","d":"a pictorial character of ancient Egyptian (or any cryptic symbol)","e":["The cartouche held the pharaoh's name in hieroglyphs."],"h":"hiero (sacred) + glyph (carving).","t":"象形文字","et":"那个王名圈里以象形文字刻着法老的名字。","lang":"en","cat":"ra","id":"ra-hieroglyph"},{"w":"sepulchre","p":"SEP-ul-kur","d":"a tomb, burial chamber (US: sepulcher); 'whited sepulchre' = hypocrite","e":["They rolled the stone from the sepulchre."],"h":"sepelire = to bury; adj. sepulchral = gloomy, tomb-like.","t":"坟墓","et":"他们把石头从墓穴口挪开。","lang":"en","cat":"ra","id":"ra-sepulchre"},{"w":"vestigial","p":"veh-STIJ-ee-ul","d":"remaining as a functionless trace of what once was (vestigial tail, vestigial habit)","e":["The appendix is vestigial; so is the 'cc' in email."],"h":"vestigium = footprint — a leftover track.","t":"退化残留的","et":"阑尾是退化残留的;电子邮件里的'抄送'也是。","lang":"en","cat":"ra","id":"ra-vestigial"},{"w":"carceral","p":"KAR-suh-rul","d":"of prisons or incarceration (the carceral state)","e":["Scholars critique the carceral turn in schooling."],"h":"carcer = prison → inCARCERate.","t":"监狱的","et":"学者们批评教育中的监狱化转向。","lang":"en","cat":"ra","id":"ra-carceral"},{"w":"diegesis","p":"dy-uh-JEE-sis","d":"the internal world of a story; diegetic sound = heard by the characters","e":["The radio song is diegetic; the swelling strings are not."],"h":"Greek 'narration' — what's inside the narrative frame.","t":"故事内世界;叙境","et":"收音机里的歌属于故事内的声音,渐强的弦乐则不是。","lang":"en","cat":"ra","id":"ra-diegesis"},{"w":"agora","p":"AG-uh-ruh","d":"the public square/marketplace of a Greek city; any forum","e":["Socrates argued in the agora."],"h":"agoraphobia = fear of the open public square.","t":"古希腊集会广场","et":"苏格拉底在集会广场上与人辩论。","lang":"en","cat":"ra","id":"ra-agora"},{"w":"raconteur","p":"rak-on-TUR","d":"a skilled, witty storyteller","e":["A born raconteur, he could stretch a delay into an epic."],"h":"French raconter = to tell.","t":"妙语说书人","et":"他天生是个说故事的能手,能把一次误点讲成一部史诗。","lang":"en","cat":"ra","id":"ra-raconteur"},{"w":"promenade","p":"prom-uh-NAHD","d":"a leisurely public walk; a seafront walkway; to stroll","e":["An evening promenade along the boardwalk."],"h":"se promener = to walk oneself (French).","t":"散步;海滨步道","et":"沿着海滨木栈道的一次傍晚散步。","lang":"en","cat":"ra","id":"ra-promenade"},{"w":"precipice","p":"PRESS-ih-piss","d":"a sheer cliff edge; the brink of disaster","e":["The economy stood at the precipice."],"h":"praeceps = headlong — same family as precipitous.","t":"悬崖;险境","et":"经济已站在悬崖边缘。","lang":"en","cat":"ra","id":"ra-precipice"},{"w":"calico","p":"KAL-ih-koh","d":"plain cotton cloth; (US) a cat with white-orange-black patches","e":["A calico dr ng the Office of the Dead.","t":"挽歌","et":"乐队把曲子放慢成一支挽歌。","lang":"en","cat":"ra","id":"ra-dirge"},{"w":"threnody","p":"THREN-uh-dee","d":"a song or poem of lamentation","e":["Penderecki's 'Threnody to the Victims of Hiroshima.'"],"h":"threnos (wailing) + ode.","t":"哀歌","et":"潘德列茨基的《广岛受难者哀歌》。","lang":"en","cat":"ra","id":"ra-threnody"},{"w":"flaneur","p":"flah-NUR","d":"an idle urban stroller-observer (French flâneur)","e":["A flâneur's Paris: cafés, arcades, unhurried eyes."],"h":"Baudelaire's connoisseur of the street.","t":"都市漫游者","et":"漫游者的巴黎:咖啡馆、拱廊街,和不慌不忙的眼睛。","lang":"en","cat":"ra","id":"ra-flaneur"},{"w":"dilettante","p":"DIL-uh-tont","d":"a dabbler; one who cultivates an art superficially","e":["A dilettante's bookshelf: fifty openings, no endings."],"h":"Italian dilettare = to delight — pleasure without rigor.","t":"浅尝辄止的票友","et":"浅尝辄止者的书架:五十个开头,没有一个结尾。","lang":"en","cat":"ra","id":"ra-dilettante"},{"w":"gourmand","p":"goor-MAHND","d":"one who loves eating, often to excess (vs. gourmet = refined judge)","e":["A gourmand orders everything; a gourmet orders exactly."],"h":"-mand = quantity; -met = quality.","t":"馋嘴老饕","et":"老饕什么都点;美食家只点那一样。","lang":"en","cat":"ra","id":"ra-gourmand"},{"w":"sommelier","p":"sum-ul-YAY","d":"a restaurant's wine steward","e":["The sommelier suggested a dry Riesling."],"h":"Originally the pack-animal driver who hauled provisions.","t":"侍酒师","et":"侍酒师推荐了一支干型雷司令。","lang":"en","cat":"ra","id":"ra-sommelier"},{"w":"amanuensis","p":"uh-man-yoo-EN-sis","d":"a literary assistant who takes dictation or copies manuscripts","e":["Milton, blind, dictated to his amanuensis daughters."],"h":"a manu = by hand — a hired hand for words.","t":"笔录助手","et":"失明的弥尔顿向充当笔录的女儿们口述。","lang":"en","cat":"ra","id":"ra-amanuensis"},{"w":"factotum","p":"fak-TOH-tum","d":"a do-everything assistant, general servant","e":["Office factotum: fixer of printers, finder of keys."],"h":"fac totum = 'do everything!' (Latin).","t":"打杂总管","et":"办公室的打杂万事通:修打印机的,找钥匙的。","lang" const LS = "lexicon.v1";

function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS));
    if(s && s.srs){ s.seals=s.seals||{}; s.bestCombo=s.bestCombo||0; s.retired=s.retired||{}; s.deleted=s.deleted||{};
      if(s.set.spellAt===undefined) s.set.spellAt=5;
      return bootstrapProd(s); } }catch(e){}
  return { srs:{}, log:{}, xp:0, custom:[], seals:{}, bestCombo:0, retired:{}, deleted:{}, mig:2, set:{ newPerDay:15, dailyGoal:20, rate:1.0, enVoice:"", zhVoice:"", spellAt:5 } };
}
/* one-time: cards already mastered (interval >= 21d) graduate straight to production */
function bootstrapProd(s){
  if(s.mig>=2) return s;
  let n=0, th=s.set.spellAt||5;
  for(const k in s.srs){ const r=s.srs[k];
    if(r.ivl>=21 && (r.qc||0)<th){ r.qc=th; n++; } }
  s.mig=2; s.bootN=n;
  return s;
}
function save(){ localStorage.setItem(LS, JSON.stringify(S)); DIRTY=true; }
function isRet(id){ return S.retired[id]>0; }
function retireCard(id){ S.retired[id]=Math.max(1,today()); save(); checkSeals(); schedulePush(); }
function restoreCard(id){ S.retired[id]=-Math.max(1,today()); save(); schedulePush(); }
function deleteCustom(id){
  S.deleted[id]=Math.max(1,today());
  S.custom=S.custom.filter(c=>c.id!==id);
  delete S.srs[id]; delete S.retired[id];

}
function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
function dayLog(d){ const k=String(d===undefined?today():d); if(!S.log[k]) S.log[k]={r:0,n:0}; return S.log[k]; }
function allCards(){ return DECK.concat(S.custom); }
const byId = () => { const m={}; for(const c of allCards()) m[c.id]=c; return m; };

function srsOf(id){ if(!S.srs[id]) S.srs[id]={ef:2.5,ivl:0,reps:0,due:0,lapses:0,qc:0,pf:0}; return S.srs[id]; }
function threshold(){ return S.set.spellAt||5; }
function bumpQc(id){ const r=srsOf(id); r.qc=(r.qc||0)+1; save(); }
/* production stage: typed spelling (EN) or handwriting (ZH). wr cards are handwriting already. */
function isProd(c){
  if(S.set.spellAt===0||c.cat==="wr") return false;
  const r=S.srs[c.id];
  return !!r && (r.qc||0)>=threshold();
}
function prodFail(id){
  const r=srsOf(id); r.pf=(r.pf||0)+1;
  if(r.pf>=3){ r.pf=0; r.qc=Math.max(0,threshold()-2); }  // demote to choice for 2 rounds
  save();
}
function prodPass(id){ const r=srsOf(id); r.pf=0; save(); }
function preview(id,g){
  const r=Object.assign({},S.srs[id]||{ef:2.5,ivl:0,reps:0});
  const iv=nextIvl(r,g); return iv===0?"稍后":fmtIvl(iv);
}
function nextIvl(r,g){
  if(g===0) return 0;
  if(r.reps===0||r.ivl===0){ return g===1?1: g===2?1:3; }
  if(g===1) return Math.max(r.ivl+1, Math.round(r.ivl*1.2));
  if(g===2) return r.ivl===1?3:Math.round(r.ivl*r.ef);
  return Math.max(r.ivl===1?4:0, Math.round(r.ivl*r.ef*1.35));
}
function grade(id,g){
  const r=srsOf(id), iv=nextIvl(r,g);
  if(g===0){ r.lapses++; r.reps=0; r.ivl=0; r.due=today(); r.ef=Math.max(1.3,r.ef-0.2); }
  else{
    if(g===1) r.ef=Math.max(1.3,r.ef-0.15);
    if(g===3) r.ef=Math.min(2.8,r.ef+0.12);
    r.reps++; r.ivl=iv; r.due=today()+iv;
  }
  dayLog().r++; S.xp += (g===0?1:2);
  save(); refreshTop();
}
function fmtIvl(d){ if(d<1)return"今天"; if(d<30)return d+"天"; if(d<365)return (d/30).toFixed(1).replace(/\.0$/,"")+"月"; return (d/365).toFixed(1).replace(/\.0$/,"")+"年"; }
/* queue */
function dueCards(){ const t=today(); return allCards().filter(c=>{if(isRet(c.id))return false; const r=S.srs[c.id]; return r && r.reps>0 && r.due<=t;}); }
function relearnCards(){ const t=today(); return allCards().filter(c=>{if(isRet(c.id))return false; const r=S.srs[c.id]; return r && r.reps===0 && r.lapses>0 && r.due<=t;}); }
function newCards(){ return allCards().filter(c=>!S.srs[c.id]&&!isRet(c.id)).sort((a,b)=>(b.pri||0)-(a.pri||0)); }
function newBudget(){ return Math.max(0, S.set.newPerDay - dayLog().n); }
function buildQueue(limit){
  let q = shuffle(dueCards()).concat(shuffle(relearnCards()));
  const nb = newBudget();
  if(nb>0){ q = q.concat(interleave(newCards(), nb)); }
  if(limit) q = q.slice(0,limit);
  return q.map(c=>c.id);
}
function interleave(cards,n){
  const en=cards.filter(c=>c.lang==="en"), zh=cards.filter(c=>c.lang==="zh"), out=[];
  let i=0,j=0;
  while(out.length<n && (i<en.length||j<zh.length)){
    if(i<en.length) out.push(en[i++]);
    if(out.length<n && j<zh.length) out.push(zh[j++]);
  }
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

const LEVELS=[[0,"初窥门径 Greenhorn"],[150,"咬文嚼字 Wordsmith"],[400,"出口成章 Raconteur"],[900,"字斟句酌 Lexicographer"],[2000,"博闻强识 Polymath"],[4200,"泰山北斗 Doyen"],[8000,"字海无涯 Logophile"]];
function levelOf(xp){ let li=0; for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i][0]) li=i; } return li; }
function streak(){
  let s=0, d=today();
  const has=k=>S.log[String(k)] && S.log[String(k)].r>0;
  if(!has(d)) d--; // allow today not yet studied
  while(has(d)){ s++; d--; }
  return s;
}
function refreshTop(){

const GIST_FILE="lexicon-progress.json";
function payload(){
  return {srs:S.srs,log:S.log,xp:S.xp,custom:S.custom,seals:S.seals,bestCombo:S.bestCombo,retired:S.retired,deleted:S.deleted,v:1,ts:Date.now()};
}
function mergeData(d){
  for(const k in (d.srs||{})){ const a=S.srs[k],b=d.srs[k];
    const qc=Math.max((a&&a.qc)||0,b.qc||0);
    if(!a || b.reps>a.reps || (b.reps===a.reps&&b.due>a.due)) S.srs[k]=b;
    S.srs[k].qc=qc;  // progress toward production never regresses
  }
  for(const k in (d.log||{})){ const a=dayLogK(k),b=d.log[k]; a.r=Math.max(a.r,b.r||0); a.n=Math.max(a.n,b.n||0); }
  S.xp=Math.max(S.xp,d.xp||0);
  S.bestCombo=Math.max(S.bestCombo||0,d.bestCombo||0);
  S.seals=Object.assign({},d.seals||{},S.seals);
  for(const k in (d.retired||{})){ const a=S.retired[k],b=d.retired[k];
    if(a===undefined || Math.abs(b)>Math.abs(a)) S.retired[k]=b; }
  S.deleted=Object.assign({},S.deleted,d.deleted||{});
  const have=new Set(S.custom.map(c=>c.id));
  for(const c of (d.custom||[])) if(!have.has(c.id)) S.custom.push(c);
  S.custom=S.custom.filter(c=>!S.deleted[c.id]);
  save();
}
async function gh(path,opts){
  const r=await fetch("https://api.github.com"+path,Object.assign({
    headers:{ "Authorization":"Bearer "+S.set.ghToken, "Accept":"application/vnd.github+json" }
  },opts||{}));
  if(!r.ok) throw new Error("GitHub "+r.status);
  return r.json();
}
let SYNCING=false, PUSHT=null;
async function syncNow(manual){
  if(!S.set.ghToken||SYNCING) return;
  SYNCING=true;
  try{
    let gid=S.set.gistId;
    if(!gid){
      const gists=await gh("/gists?per_page=100");
      const hit=gists.find(g=>g.files&&g.files[GIST_FILE]);
      if(hit){ gid=hit.id; }
      else{
        const created=await gh("/gists",{method:"POST",body:JSON.stringify(
          {description:"拾遗 Lexicon progress (auto-sync)",public:false,files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
        gid=created.id;
      }
      S.set.gistId=gid; save();
    }
    const g=await gh("/gists/"+gid);
    const f=g.files&&g.files[GIST_FILE];
    if(f){
      let txt=f.content;
      if(f.truncated){ const rr=await fetch(f.raw_url); txt=await rr.text(); }
      try{ mergeData(JSON.parse(txt)); }catch(e){}
    }
    await gh("/gists/"+gid,{method:"PATCH",body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(payload())}}})});
    S.set.lastSync=Date.now(); save(); DIRTY=false;
    refreshTop();
    if(!SESSION&&TAB==="review") vReview();
    if(manual){ toast("已同步 ✓"); if(TAB==="stats") vStats(); }
  }catch(e){
    if(manual) toast("同步失败:"+e.message+(location.protocol==="https:"?"":" (需在网页版使用)"));
  }
  SYNCING=false;
}
function schedulePush(){
  if(!S.set.ghToken) return;

}

let VOICES=[];
function loadVoices(){ VOICES = speechSynthesis.getVoices(); }

function pickVoice(lang){
  const pref = lang==="en"?S.set.enVoice:S.set.zhVoice;
  if(pref){ const v=VOICES.find(v=>v.name===pref); if(v) return v; }
  const want = lang==="en"?"en":"zh";
  return VOICES.find(v=>v.lang.toLowerCase().startsWith(want+"-")||v.lang.toLowerCase()===want) || null;
}
function speak(text,lang,rate){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)||!text){ res(); return; }
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(lang); if(v) u.voice=v;
    u.lang = lang==="en"?"en-US":"zh-CN";
    u.rate = rate||S.set.rate||1;
    u.onend=()=>res(); u.onerror=()=>res();
    speechSynthesis.speak(u);
  });
}
function speakCard(c){
  speechSynthesis.cancel();
  if(c.lang==="en") speak(c.w,"en");

}

async function radioLoop(){
  while(R.on && R.list.length){
    if(R.idx>=R.list.length) R.idx=0; // loop
    const c=R.list[R.idx];
    const np=document.getElementById("npBox");
    if(np){ np.innerHTML =
      '<div class="chip '+c.lang+'" style="display:inline-block">'+(c.lang==="en"?"EN":"中")+'</div>'+
      '<div class="npw '+(c.lang==="zh"?"kai":"serif")+'">'+esc(c.w)+'</div>'+
      (c.p?'<div class="npd" style="margin-bottom:4px">'+esc(c.p)+'</div>':"")+
      '<div class="npd">'+esc(c.d)+'</div>'; }
    const gen=R.gen;
    for(const [t,l] of radioSegments(c)){
      if(!R.on) return;
      if(R.gen!==gen) break;
      await speak(t,l);
      if(!R.on) return;
      if(R.gen!==gen) break;
      await new Promise(r=>setTimeout(r,450));

}

function pickN(pool,n,exclude){
  const out=[], used=new Set(exclude||[]);
  for(const x of shuffle(pool)){
    if(out.length>=n) break;
    if(x==null||x===""||used.has(x)) continue;
    used.add(x); out.push(x);
  }
  return out;
}
function fold(s){ return String(s==null?"":s).normalize("NFD").replace(/[̀-ͯ]/g,""); }
/* plausible inflected forms of a headword, so we blank the right token and never a lookalike */
function wordForms(w){
  const l=fold(w).toLowerCase(), out=new Set([l]);
  if(l.indexOf(" ")>=0) return out;
  const noE=l.replace(/e$/,""), yI=l.replace(/y$/,"i");
  for(const s of ["s","es","d","ed","ing","er","est","ly","ion","ions"]){
    out.add(l+s); out.add(noE+s); if(l!==yI) out.add(yI+s);
  }
  if(/[^aeiou][aeiou][^aeiouwxy]$/.test(l)){       // CVC doubling: rebut -> rebutted
    const d=l+l.slice(-1);
    out.add(d+"ing"); out.add(d+"ed"); out.add(d+"er");
  }
  return out;
}
/* blank EVERY occurrence of the target (a second occurrence would give the answer away) */
function blankAll(sentence,word){
  const WORD=/[a-zA-ZÀ-ÿ]+(?:-[a-zA-ZÀ-ÿ]+)*/;   // accented letters count; stops before 's
  if(word.indexOf(" ")>=0){
    const re=new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    const m=sentence.match(re);
    if(!m) return null;
    return {sent:sentence.replace(re,"______"), token:m[0]};
  }
  const forms=wordForms(word), parts=sentence.split(/(\s+)/);
  let token=null, hits=[];
  for(let i=0;i<parts.length;i++){
    const m=parts[i].match(WORD); if(!m) continue;
    if(forms.has(fold(m[0]).toLowerCase())){ hits.push(i); if(!token) token=m[0]; }
  }
  if(!hits.length){                                 // fallback: a longer derived form (asperse -> aspersions)
    const stem=fold(word).toLowerCase().replace(/(e|y)$/,"");
    if(stem.length>=4) for(let i=0;i<parts.length;i++){
      const m=parts[i].match(WORD); if(!m) continue;
      const c=fold(m[0]).toLowerCase();
      if(c.indexOf(stem)===0 && c.length>word.length-1 && c.length<=word.length+4){ hits.push(i); if(!token) token=m[0]; }
    }
  }
  if(!hits.length) return null;
  for(const i of hits) parts[i]=parts[i].replace(WORD,"______");
  return {sent:parts.join(""), token:token};
}
function blankOut(sentence,word){ const r=blankAll(sentence,word); return r?r.sent:null; }
function qConfusable(c){

  if(opts.length<3) opts=opts.concat(pickN(DECK.filter(x=>x.cat==="cf"||x.cat==="ac").map(x=>x.w),3-opts.length,opts));

function qMeaning(c){
  const pool=DECK.filter(x=>x.cat===c.cat&&x.id!==c.id&&x.t);

const IDSTOP=new Set(["the","with","under","down","someone's","your","out","into","over","that"]);
function idiomKey(w){
  const ws=w.split(" ").filter(x=>x.length>3&&!IDSTOP.has(x.toLowerCase()));

function qIdiom(c){

  const opts=shuffle([key].concat(pickN(pool,3,[key])));

function qHanzi(c){

function poolWords(c){
  let pool=allCards().filter(x=>x.lang===c.lang&&x.id!==c.id&&x.cat!=="id").map(x=>x.w);
  if(c.lang==="zh"){
    const near=pool.filter(w=>Math.abs(w.length-c.w.length)<=1);
    if(near.length>=3) pool=near;
  }

function qCustom(c){
  const pool=poolWords(c);
  if(pool.length<3) return null;
  for(const ex of (c.e||[])){
    let blanked=null;
    if(c.lang==="en"){ blanked=blankOut(ex,c.w); }
    else if(c.w && ex.includes(c.w)){ blanked=ex.replace(c.w,"______"); }
    if(blanked){
      const opts=shuffle([c.w].concat(pickN(pool,3,[c.w])));
      return {prompt:'<div class="qprompt'+(c.lang==="en"?" serif":"")+'">'+esc(blanked).replace(/_{3,}/,'<span class="bl">______</span>')+'</div><div class="qsub">填哪个词?</div>',opts,answer:c.w,cls:c.lang==="en"?"serifopt":""};
    }

/* ---- production-stage builders ---- */
function spellTarget(c){
  if(c.cat==="id"){
    const ex=(c.e||[])[0];
    if(ex){                       // prefer a substantive word that actually occurs in the example
      const cands=c.w.split(" ").filter(x=>x.length>=4&&!IDSTOP.has(x.toLowerCase()))
                     .sort((a,b)=>b.length-a.length);
      for(const cd of cands) if(blankAll(ex,cd)) return cd;
    }
    const k=idiomKey(c.w); if(k&&k!==c.w) return k;
  }
  return c.w;
}
function qSpell(c){
  const target=spellTarget(c);
  const ex=(c.e||[])[0];
  if(ex&&c.et){
    const bi=blankAll(ex,target);
    if(bi) return {sent:bi.sent, zh:c.et, accept:[bi.token,target,c.w], show:bi.token};
  }
  if(!c.t&&!c.d) return null;
  return {sent:null, zh:c.t||"", def:maskEn(c.d,c.w), accept:[c.w], show:c.w};

function normSp(s){
  return fold(s).toLowerCase().trim()
    .replace(/[‘’]/g,"'").replace(/[–—]/g,"-").replace(/\s+/g," ");
}
function lev(a,b){
  const m=a.length,n=b.length;
  if(Math.abs(m-n)>2) return 3;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
/* mask EVERY occurrence, and put nothing in the DOM that could be peeked at */
function blankHanzi(c){
  const box='<span class="bl">'+"　".repeat(c.w.length)+'</span>';
  for(const ex of (c.e||[])){
    if(ex.indexOf(c.w)<0) continue;
    return ex.split(c.w).map(esc).join(box);

}
function maskZh(text,w){ return String(text||"").split(w).join("▢".repeat(w.length)); }
function maskEn(text,word){
  let out=String(text||"");
  const parts=word.indexOf(" ")>=0
    ? word.split(" ").filter(x=>x.length>=3&&!IDSTOP.has(x.toLowerCase()))
    : [word];
  for(const p of parts){ const r=blankAll(out,p); if(r) out=r.sent; }
  return out;
}
function questionFor(c){

function renderSpell(c,q){
  const body = q.sent
    ? '<div class="spellsent serif">'+esc(q.sent).replace(/_{3,}/,'<span class="bl">______</span>')+'</div><div class="spellzh">'+esc(q.zh)+'</div>'
    : '<div class="spellzh">'+esc(q.zh)+'</div><div class="qprompt">'+esc(q.def||"")+'</div>';
  view.innerHTML = sessionBar()+
   '<div class="card rev" id="revCard"><div class="meta">'+chipsFor(c,false,true)+'</div>'+body+
   '<input class="spellin" id="spellIn" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="拼出这个词">'+
   '<div class="padrow" style="margin-top:10px"><button class="btn small" id="hintBtn">提示</button><button class="btn primary small" id="ckBtn" style="flex:1">检查</button></div>'+
   '<div id="spellMsg"></div><div style="margin-top:auto"></div></div>';
  document.getElementById("endS").onclick=()=>renderDone();
  const inp=document.getElementById("spellIn"), msg=document.getElementById("spellMsg");
  if(!("ontouchstart" in window)) inp.focus();   // on phones, let the prompt be read before the keyboard covers it
  let tries=0, done=false;
  document.getElementById("hintBtn").onclick=()=>{
    const t=q.show;
    msg.innerHTML='<div class="spellhint">'+esc(t[0])+" "+"_ ".repeat(Math.max(0,t.length-1)).trim()+'</div>'+
     '<div class="writesub">'+t.length+' 个字符</div>';
    inp.focus();
  };
  function finish(ok){
    document.getElementById("hintBtn").disabled=true;
    document.getElementById("ckBtn").disabled=true;
    msg.innerHTML = ok?"":'<div class="answord">'+esc(q.show)+'</div>';
    prodResolve(c,ok);
  }
  function check(){
    if(done) return;
    const val=normSp(inp.value);
    if(!val) return;
    if(q.accept.some(a=>normSp(a)===val)){ done=true; inp.classList.add("ok"); inp.disabled=true; finish(true); return; }
    if(tries===0 && q.accept.some(a=>lev(normSp(a),val)<=1)){
      tries++;
      msg.innerHTML='<div class="nearmiss">就差一个字母 —— 再看一眼</div>';
      inp.select(); return;
    }
    done=true; inp.classList.add("no"); inp.disabled=true; finish(false);
  }
  document.getElementById("ckBtn").onclick=check;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); check(); } };
}

/* handwriting pad: ghost layer (answer overlay) under ink layer */
function padHTML(){
  return '<div class="padwrap"><canvas class="ghost" id="padGhost"></canvas><canvas class="ink" id="pad"></canvas></div>'+
   '<div class="padrow"><button class="btn small" id="padClear">清除重写</button></div>';
}
function initPad(){
  const cv=document.getElementById("pad"); if(!cv) return;
  const gh=document.getElementById("padGhost");
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  for(const el of [cv,gh]){ if(el){ el.width=w*dpr; el.height=h*dpr; el.getContext("2d").scale(dpr,dpr); } }
  const ctx=cv.getContext("2d");
  ctx.lineWidth=4; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=getComputedStyle(document.body).color;
  let draw=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{draw=true;[px,py]=pos(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!draw)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();[px,py]=[x,y];};
  cv.onpointerup=cv.onpointercancel=()=>{draw=false;};
  const cl=document.getElementById("padClear"); if(cl) cl.onclick=()=>ctx.clearRect(0,0,w,h);
}
/* draw the correct character(s) faintly behind the user's ink for comparison */
function revealGhost(text){
  const gh=document.getElementById("padGhost"); if(!gh) return;
  const w=gh.clientWidth,h=gh.clientHeight;
  const ctx=gh.getContext("2d");
  ctx.clearRect(0,0,w,h);
  const size=Math.min(h*0.82, (w*0.86)/Math.max(1,text.length));
  ctx.font='400 '+size+'px "Kaiti SC","STKaiti",KaiTi,"Songti SC",serif';
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle=getComputedStyle(document.body).color;
  ctx.globalAlpha=0.22;
  ctx.fillText(text,w/2,h/2);
  ctx.globalAlpha=1;
}

    const entry={ id:"cu-"+Date.now().toString(36), lang:ADD_LANG, cat: wr?"wr":"cu", w, p, d,
      e: ex?[ex]:undefined, h: h||undefined, cue: wr?("【"+(p||"?")+"】 — "+d):undefined };
    S.custom.push(entry); save(); schedulePush();
    toast("已加入:"+w+(ex&&ex.includes(w)?"(将自动出填空题)":""));
    e.target.reset();
  };
}
/* ---- seals cabinet ---- */
let EXPSET=null;
function fmtDay(d){ const dt=new Date(d*86400000); return (dt.getUTCMonth()+1)+"月"+dt.getUTCDate()+"日"; }
function vSeals(){
  const M=byId();
  const doneN=SETS.filter(s=>S.seals[s.id]).length;
  const stateOf=id=>{ if(isRet(id)) return 2; const r=S.srs[id]; return r? (r.ivl>=10?2:1) : 0;};
  view.innerHTML='<h2 class="viewtitle">收藏阁 · 已钤印 '+doneN+' / '+SETS.length+'</h2>'+
  '<div style="font-size:13px;color:var(--ink-soft);line-height:1.5;margin:0 2px 4px">一个词集内所有词达到「熟记」(复习间隔 ≥ 10 天)即可钤印,+50 XP。点开看还差哪几个。</div>'+
  '<div class="sealgrid">'+SETS.map(st=>{
    const done=!!S.seals[st.id];
    const got=st.members.filter(id=>stateOf(id)===2).length;
    const open=EXPSET===st.id;
    return '<div class="card sealtile" data-s="'+esc(st.id)+'"'+(open?' style="grid-column:1/-1"':"")+'>'+
    '<div class="seal '+(done?"done":"todo")+'">'+esc(st.seal)+'</div>'+
    '<div class="sn">'+esc(st.name)+'</div><div class="se">'+esc(st.en)+'</div>'+
    '<div class="sp">'+(done?"已钤印 · "+fmtDay(S.seals[st.id]):got+" / "+st.members.length+" 熟记")+'</div>'+
    (open?'<div class="sdesc">'+esc(st.desc)+'</div><div class="members">'+st.members.map(id=>{
      const c=M[id], stt=stateOf(id);
      return '<span class="m '+(stt===2?"got":stt===1?"mid":"")+'">'+esc(c?c.w:id)+'</span>';
    }).join("")+'</div>':"")+
    '</div>';
  }).join("")+'</div>'+
  '<div style="font-size:12px;color:var(--ink-soft);margin:12px 2px;line-height:1.5">图例:<span class="m got" style="padding:2px 8px;border-radius:99px;background:var(--zh-soft);color:var(--zh)">熟记</span> <span style="color:var(--gold)">在学</span> · 灰色未开始</div>';
  document.querySelectorAll(".sealtile").forEach(t=>t.onclick=()=>{ EXPSET=EXPSET===t.dataset.s?null:t.dataset.s; vSeals(); });
}
/* ---- stats ---- */
function vStats(){
  const cards=allCards();
  const mastered=cards.filter(c=>{const r=S.srs[c.id];return r&&r.ivl>=21;}).length;
  const learning=cards.filter(c=>S.srs[c.id]).length-mastered;
  const li=levelOf(S.xp); const nxt=LEVELS[li+1];
  const cats=[["ac","学术词","en"],["cf","易混词","en"],["ra","罕词","en"],["ev","日常词","en"],["id","习语","en"],["hz","生僻字","zh"],["wr","手写","zh"]];
  let catrows="";
  for(const [k,l,lg] of cats){
    const cs=cards.filter(c=>c.cat===k); if(!cs.length) continue;
    const m=cs.filter(c=>{const r=S.srs[c.id];return r&&r.ivl>=21;}).length;
    const s=cs.filter(c=>S.srs[c.id]).length;
    catrows+='<div class="card prow"><div class="pl"><span>'+l+'</span><b>'+m+' 掌握 / '+s+' 在学 / '+cs.length+'</b></div>'+
    '<div class="pbar"><i style="width:'+(100*m/cs.length)+'%;background:var(--'+lg+')"></i></div></div>';
  }
  // heatmap: last 26*7 days? use 26 cols x 7 rows = 182 days; simpler 26x4=104? Keep 26 cols x 7 rows.
  let heat=""; const t=today();
  const max=Math.max(1,...Object.values(S.log).map(v=>v.r||0));
  const days=26*7;
  let cells=[];
  for(let i=days-1;i>=0;i--){
    const v=(S.log[String(t-i)]||{}).r||0;
    const cl=v===0?"":v<max*0.34?"h1":v<max*0.67?"h2":"h3";
    cells.push('<i class="'+cl+'" title="'+v+'"></i>');
  }
  heat=cells.join("");
  view.innerHTML='<h2 class="viewtitle">统计</h2>'+
  '<div class="statgrid">'+
  '<div class="card mini"><div class="n" style="color:var(--gold)">'+streak()+'</div><div class="l">连续天数</div></div>'+
  '<div class="card mini"><div class="n">'+S.xp+'</div><div class="l">XP · '+esc(LEVELS[li][1])+(nxt?' → '+nxt[0]:"")+'</div></div>'+
  '<div class="card mini"><div class="n">'+mastered+'</div><div class="l">已掌握(间隔≥21天)</div></div>'+
  '<div class="card mini"><div class="n">'+learning+'</div><div class="l">复习中</div></div>'+
  '<div class="card mini"><div class="n">×'+(S.bestCombo||0)+'</div><div class="l">连击纪录</div></div>'+
  '<div class="card mini"><div class="n" style="color:var(--gold)">'+cards.filter(c=>!isRet(c.id)&&isProd(c)).length+'</div><div class="l">已进入拼写/手写阶段</div></div>'+
  '<div class="card mini"><div class="n">'+SETS.filter(s=>S.seals[s.id]).length+'<span style="font-size:14px;color:var(--ink-soft)"> / '+SETS.length+'</span></div><div class="l">印章 → 见「收藏」</div></div>'+
  '</div>'+
  '<div class="card" style="padding:14px;margin-top:10px"><div style="font-size:13px;color:var(--ink-soft);margin-bottom:2px">最近 26 周</div><div class="heat">'+heat+'</div></div>'+
  '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+catrows+'</div>'+
  '<div class="card settings"><div style="font-weight:700;margin-bottom:4px">设置</div>'+
  '<div class="setrow"><span>每日新词上限</span><input type="number" id="setNew" min="0" max="99" value="'+S.set.newPerDay+'"></div>'+
  '<div class="setrow"><span>每日目标(张)</span><input type="number" id="setGoal" min="5" max="200" value="'+S.set.dailyGoal+'"></div>'+
  '<div class="setrow"><span>答对几次后转为拼写/手写<br><span style="font-size:12px;color:var(--ink-soft)">0 = 关闭产出练习</span></span><input type="number" id="setSpell" min="0" max="30" value="'+threshold()+'"></div>'+
  '<div class="setrow"><span>经典翻卡模式(关闭选择题)</span><input type="checkbox" id="setClassic" style="width:auto" '+(S.set.classic?"checked":"")+'></div>'+
  '<div class="setrow"><span>英文语音</span><select id="setEnV"></select></div>'+
  '<div class="setrow"><span>中文语音</span><select id="setZhV"></select></div>'+
  '<div class="setrow" style="flex-direction:column;align-items:stretch"><span style="margin-bottom:6px">自动同步(GitHub Gist)· '+(S.set.ghToken?('<b style="color:var(--g-good)">已连接</b>'+(S.set.lastSync?' · 上次同步 '+new Date(S.set.lastSync).toLocaleString():"")):"未连接")+'</span>'+
  (S.set.ghToken?
   '<div class="btnrow" style="justify-content:flex-start"><button class="btn small" id="syncNowBtn">立即同步</button><button class="btn small" id="syncOffBtn">断开</button></div>':
   '<input id="ghTok" type="password" autocomplete="off" placeholder="粘贴 GitHub token(仅需 gist 权限)" style="padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">'+
   '<div class="btnrow" style="justify-content:flex-start;margin-top:8px"><button class="btn small" id="syncOnBtn">连接并同步</button></div>'+
   '<div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:6px">进度存到你自己的私密 Gist,每台设备粘贴一次同一个 token 即可。token 只保存在本机浏览器,创建方法见 README。</div>')+
  '</div>'+
  '<div class="setrow" style="flex-direction:column;align-items:stretch"><span style="margin-bottom:6px">手动备份:导出进度(复制到另一台设备导入)</span>'+
  '<textarea class="io" id="ioBox" placeholder="点「导出」生成,或粘贴后点「导入」"></textarea>'+
  '<div class="btnrow" style="justify-content:flex-start"><button class="btn small" id="expBtn">导出</button><button class="btn small" id="impBtn">导入</button><button class="btn small" id="cpBtn">复制</button></div></div>'+
  '<div class="setrow"><span style="color:var(--g-again)">清空全部进度</span><button class="btn small" id="rstBtn">重置</button></div>'+
  '</div>';
  const sn=document.getElementById("setNew"), sg=document.getElementById("setGoal");
  sn.onchange=()=>{S.set.newPerDay=Math.max(0,+sn.value||0);save();};
  sg.onchange=()=>{S.set.dailyGoal=Math.max(1,+sg.value||20);save();refreshTop();};
  document.getElementById("setClassic").onchange=e=>{S.set.classic=e.target.checked;save();};
  const sp=document.getElementById("setSpell");
  sp.onchange=()=>{S.set.spellAt=Math.max(0,Math.min(30,+sp.value||0));save();vStats();};
  const fill=(sel,lang,cur)=>{
    const vs=VOICES.filter(v=>v.lang.toLowerCase().startsWith(lang));
    sel.innerHTML='<option value="">自动</option>'+vs.map(v=>'<option '+(v.name===cur?"selected":"")+' value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join("");
  };
  fill(document.getElementById("setEnV"),"en",S.set.enVoice);
  fill(document.getElementById("setZhV"),"zh",S.set.zhVoice);
  document.getElementById("setEnV").onchange=e=>{S.set.enVoice=e.target.value;save();};
  document.getElementById("setZhV").onchange=e=>{S.set.zhVoice=e.target.value;save();};
  const sOn=document.getElementById("syncOnBtn");
  if(sOn) sOn.onclick=()=>{
    const tk=document.getElementById("ghTok").value.trim();
    if(!tk){ toast("先粘贴 token"); return; }
    S.set.ghToken=tk; save();
    toast("连接中…");
    syncNow(true);
  };
  const sNow=document.getElementById("syncNowBtn");
  if(sNow) sNow.onclick=()=>syncNow(true);
  const sOff=document.getElementById("syncOffBtn");
  if(sOff) sOff.onclick=()=>{ delete S.set.ghToken; save(); toast("已断开(Gist 数据保留)"); vStats(); };
  document.getElementById("expBtn").onclick=()=>{
    const st=Object.assign({},S.set); delete st.ghToken;
    const data=Object.assign(payload(),{set:st});
    document.getElementById("ioBox").value="LEX1."+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    toast("已生成,点「复制」后到另一台设备粘贴导入");
  };
  document.getElementById("cpBtn").onclick=async()=>{
    const v=document.getElementById("ioBox").value; if(!v){toast("先点「导出」");return;}
    try{ await navigator.clipboard.writeText(v); toast("已复制"); }catch(e){ toast("请手动全选复制"); }
  };
  document.getElementById("impBtn").onclick=()=>{
    let v=document.getElementById("ioBox").value.trim();
    if(!v.startsWith("LEX1.")){ toast("格式不对,应以 LEX1. 开头"); return; }
    try{
      const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
      mergeData(d);
      schedulePush(); refreshTop(); toast("导入完成"); vStats();
    }catch(e){ toast("导入失败:数据无法解析"); }
  };
  document.getElementById("rstBtn").onclick=()=>{
    if(confirm("确定清空全部学习进度?此操作不可撤销。")){ localStorage.removeItem(LS); S=load(); save(); refreshTop(); vReview(); go("review"); toast("已重置"); }
  };
}
function dayLogK(k){ if(!S.log[k]) S.log[k]={r:0,n:0}; return S.log[k]; }
/* ================= init ================= */
renderTabs(); refreshTop(); vReview();
if(S.set.ghToken) syncNow(false);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&DIRTY&&S.set.ghToken) syncNow(false);
});
</script>
</body></html>
