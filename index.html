<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾遗 Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --paper:#F4F5F2; --ink:#232829; --ink-soft:#5A6260; --line:#DDE0DA; --card:#FFFFFF;
  --en:#16697A; --en-soft:#E3EEF0; --zh:#B5432A; --zh-soft:#F4E7E2;
  --gold:#A8841C; --gold-soft:#F3ECD8;
  --g-again:#B3403A; --g-hard:#B07E24; --g-good:#4A8A57; --g-easy:#3A7CA5;
  --shadow:0 1px 3px rgba(35,40,41,.08), 0 4px 16px rgba(35,40,41,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141718; --ink:#E6E8E4; --ink-soft:#9BA39F; --line:#2C3133; --card:#1D2122;
    --en:#5FB0C2; --en-soft:#1B2E33; --zh:#E08165; --zh-soft:#33221D;
    --gold:#D4B24A; --gold-soft:#2E2917;
    --g-again:#D0665F; --g-hard:#CFA045; --g-good:#6FAE7C; --g-easy:#67A5CC;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --paper:#F4F5F2; --ink:#232829; --ink-soft:#5A6260; --line:#DDE0DA; --card:#FFFFFF;
  --en:#16697A; --en-soft:#E3EEF0; --zh:#B5432A; --zh-soft:#F4E7E2;
  --gold:#A8841C; --gold-soft:#F3ECD8;
  --g-again:#B3403A; --g-hard:#B07E24; --g-good:#4A8A57; --g-easy:#3A7CA5;
  --shadow:0 1px 3px rgba(35,40,41,.08), 0 4px 16px rgba(35,40,41,.06);
}
:root[data-theme="dark"]{
  --paper:#141718; --ink:#E6E8E4; --ink-soft:#9BA39F; --line:#2C3133; --card:#1D2122;
  --en:#5FB0C2; --en-soft:#1B2E33; --zh:#E08165; --zh-soft:#33221D;
  --gold:#D4B24A; --gold-soft:#2E2917;
  --g-again:#D0665F; --g-hard:#CFA045; --g-good:#6FAE7C; --g-easy:#67A5CC;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100dvh; -webkit-tap-highlight-color:transparent;
}
.serif{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Songti SC","STSong",serif}
.kai{font-family:"Kaiti SC","STKaiti",KaiTi,"Songti SC",serif}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom));}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 2px 10px;position:sticky;top:0;background:var(--paper);z-index:5;
}
.brand{font-weight:700;font-size:19px;letter-spacing:.5px}
.brand .lat{font-family:Palatino,Georgia,serif;font-weight:400;font-style:italic;color:var(--ink-soft);font-size:15px;margin-left:4px}
.topstats{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-soft);background:var(--card)}
.pill b{color:var(--ink);font-weight:600}
.pill.streak b{color:var(--gold)}
.ring{width:30px;height:30px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line);fill:none}
.ring .fg{stroke:var(--gold);fill:none;stroke-linecap:round;transition:stroke-dashoffset .4s}
main{display:block}
h2.viewtitle{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);font-weight:600;margin:14px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* ---- dashboard ---- */
.dash{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.duecard{padding:22px 20px;text-align:center}
.duecard .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.duecard .sub{color:var(--ink-soft);font-size:14px;margin-top:4px}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;color:var(--ink)}
button:focus-visible{outline:2px solid var(--en);outline-offset:2px}
.btn{padding:12px 22px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:8px 14px;font-size:13.5px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{padding:14px 16px}
.mini .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .l{font-size:12.5px;color:var(--ink-soft)}
/* ---- review card ---- */
.rev{margin-top:8px;padding:22px 20px;min-height:340px;display:flex;flex-direction:column}
.rev .meta{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.chip{font-size:11.5px;padding:2.5px 9px;border-radius:999px;font-weight:600;letter-spacing:.04em}
.chip.en{background:var(--en-soft);color:var(--en)}
.chip.zh{background:var(--zh-soft);color:var(--zh)}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:500}
.rev .word{font-size:34px;line-height:1.2;font-weight:600;text-wrap:balance;margin:6px 0 2px}
.rev .word.zh1{font-size:76px;font-weight:400;text-align:center;margin:18px 0 6px}
.rev .cue{font-size:22px;line-height:1.6;margin:10px 0}
.rev .cue .blank{color:var(--zh);font-weight:600}
.rev .pron{color:var(--ink-soft);font-size:16px;margin:2px 0 10px;font-style:italic}
.rev .pron.zh{font-style:normal;font-weight:600;color:var(--zh);font-size:20px}
.rev .def{font-size:17px;line-height:1.55;margin:6px 0}
.trans{color:var(--zh);font-weight:600;font-size:15.5px;margin:0 0 8px}
.btr{color:var(--zh);font-weight:500}
.rev .ans .word.zh1{margin:6px 0}
.contra{margin:12px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.contra .row{display:flex;gap:12px;padding:9px 12px;font-size:14.5px;line-height:1.45}
.contra .row+.row{border-top:1px solid var(--line)}
.contra .row.self{background:var(--en-soft)}
.contra .cw{font-weight:700;min-width:86px;flex-shrink:0;font-family:Palatino,Georgia,serif}
.contra .cg{color:var(--ink-soft)}
.contra .czh{color:var(--zh);font-weight:500}
.contra .cex{display:block;font-style:italic;font-size:13.5px;margin-top:3px;opacity:.9}
.exs{margin:10px 0 0;padding:0 0 0 0;list-style:none}
.exs li{font-size:15px;line-height:1.55;color:var(--ink-soft);padding-left:14px;position:relative;margin-top:6px}
.exs li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:2px;background:var(--ink-soft);opacity:.6}
.hook{margin-top:12px;padding:10px 12px;background:var(--gold-soft);border-radius:10px;font-size:14px;line-height:1.5;color:var(--ink)}
.hook b{color:var(--gold)}
.showbar{margin-top:auto;padding-top:18px}
.showbar .btn{width:100%;padding:15px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:18px}
.grades button{padding:11px 4px 9px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.grades .gl{font-weight:700;font-size:14.5px}
.grades .gi{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.grades .b0 .gl{color:var(--g-again)} .grades .b1 .gl{color:var(--g-hard)}
.grades .b2 .gl{color:var(--g-good)} .grades .b3 .gl{color:var(--g-easy)}
.grades .b0{border-color:color-mix(in srgb,var(--g-again) 45%,var(--line))}
.grades .b1{border-color:color-mix(in srgb,var(--g-hard) 45%,var(--line))}
.grades .b2{border-color:color-mix(in srgb,var(--g-good) 45%,var(--line))}
.grades .b3{border-color:color-mix(in srgb,var(--g-easy) 45%,var(--line))}
.sessionbar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
/* ---- quiz ---- */
.qprompt{font-size:19px;line-height:1.65;margin:10px 0 2px}
.qprompt .bl{color:var(--en);font-weight:700;letter-spacing:1px}
.qsub{font-size:13px;color:var(--ink-soft);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opts button{padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;text-align:left;line-height:1.4;color:var(--ink)}
.opts button.serifopt{font-family:Palatino,"Palatino Linotype",Georgia,serif;font-size:17px}
.opts button.right{border-color:var(--g-good);background:color-mix(in srgb,var(--g-good) 14%,var(--card));font-weight:700}
.opts button.wrong{border-color:var(--g-again);background:color-mix(in srgb,var(--g-again) 14%,var(--card))}
.opts button:disabled{cursor:default}
.verdict{font-weight:700;margin-top:14px;font-size:15px}
.verdict.ok{color:var(--g-good)} .verdict.no{color:var(--g-again)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.combo.bump{display:inline-block;animation:bump .3s}
.contbar{margin-top:16px}
.contbar .btn{width:100%;padding:14px}
/* ---- seals ---- */
.sealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.sealtile{padding:14px 10px;text-align:center;cursor:pointer}
.seal{width:76px;height:76px;margin:0 auto 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:"Kaiti SC","STKaiti",KaiTi,serif;font-size:24px;line-height:1.12;letter-spacing:1px;writing-mode:vertical-rl}
.seal.done{background:var(--zh);color:#FFF7F0;transform:rotate(-3deg);box-shadow:0 3px 10px rgba(181,67,42,.3)}
.seal.todo{border:2px dashed var(--line);color:var(--ink-soft)}
.sealtile .sn{font-weight:700;font-size:14.5px}
.sealtile .se{font-size:11px;color:var(--ink-soft);font-style:italic}
.sealtile .sp{font-size:12px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.members .m{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.members .m.got{background:var(--zh-soft);color:var(--zh);border-color:transparent;font-weight:600}
.members .m.mid{border-color:var(--gold);color:var(--gold)}
.sdesc{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.celebrate{text-align:center;padding:44px 20px;margin-top:8px}
.celebrate .seal{width:118px;height:118px;font-size:38px;margin-bottom:16px;animation:stamp .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{0%{transform:scale(2.1) rotate(6deg);opacity:0}60%{transform:scale(.94) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){ .celebrate .seal{animation:none} }
.speakbtn{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px}
.speakbtn svg{width:16px;height:16px;fill:var(--ink-soft)}
.padwrap{position:relative;height:230px;margin:8px 0;border:1.5px dashed var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.padwrap canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.padwrap canvas.ink{touch-action:none}
.padrow{display:flex;gap:8px;justify-content:center}
/* ---- production stage (spelling / handwriting) ---- */
.chip.prod{background:var(--gold-soft);color:var(--gold)}
.spellsent{font-size:19px;line-height:1.7;margin:8px 0 10px}
.spellsent .bl{color:var(--en);font-weight:700;letter-spacing:1.5px}
.spellzh{font-size:16px;line-height:1.6;color:var(--zh);font-weight:500;padding:10px 12px;background:var(--zh-soft);border-radius:10px;margin-bottom:6px}
.spellin{width:100%;padding:14px;font-size:21px;font-family:Palatino,"Palatino Linotype",Georgia,serif;letter-spacing:.5px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);text-align:center}
.spellin:focus-visible{outline:2px solid var(--en);border-color:var(--en)}
.spellin.ok{border-color:var(--g-good);background:color-mix(in srgb,var(--g-good) 10%,var(--card))}
.spellin.no{border-color:var(--g-again);background:color-mix(in srgb,var(--g-again) 10%,var(--card))}
.spellhint{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:8px;font-family:ui-monospace,Menlo,monospace;letter-spacing:3px}
.nearmiss{color:var(--g-hard);font-weight:600;text-align:center;margin-top:10px;font-size:14.5px}
.answord{font-size:26px;font-weight:700;font-family:Palatino,Georgia,serif;color:var(--g-good);text-align:center;margin:4px 0}
.writecue{font-size:22px;line-height:1.8;text-align:center;margin:8px 0 2px}
.writecue .bl{display:inline-block;min-width:1.6em;border-bottom:3px solid var(--zh);color:transparent}
.writesub{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:4px}
.writesub b{color:var(--zh);font-weight:600;font-size:17px}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.twobtn button{padding:13px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.twobtn .yes{border-color:color-mix(in srgb,var(--g-good) 50%,var(--line));color:var(--g-good)}
.twobtn .no{border-color:color-mix(in srgb,var(--g-again) 50%,var(--line));color:var(--g-again)}
/* ---- radio ---- */
.radio{padding:20px;margin-top:8px;text-align:center}
.radio select,.radio input[type=range]{font:inherit}
.rctl{display:flex;gap:10px;justify-content:center;align-items:center;margin:18px 0 6px}
.playbtn{width:74px;height:74px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:26px;display:flex;align-items:center;justify-content:center}
.skipbtn{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:17px}
.nowplaying{margin-top:16px;min-height:120px}
.nowplaying .npw{font-size:30px;font-weight:600;margin:4px 0}
.nowplaying .npd{color:var(--ink-soft);font-size:14.5px;line-height:1.5;max-width:46ch;margin:0 auto}
.selrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.raterow{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;font-size:13px;color:var(--ink-soft)}
input[type=range]{accent-color:var(--en)}
.radionote{font-size:12.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5}
/* ---- browse ---- */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:8px}
.search:focus-visible{outline:2px solid var(--en)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-soft)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{padding:12px 14px;cursor:pointer}
.bitem .bw{font-weight:600;font-size:16.5px}
.bitem .bd{color:var(--ink-soft);font-size:13.5px;margin-top:2px;line-height:1.45}
.bitem .full{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.bstat{font-size:11.5px;color:var(--ink-soft);float:right;font-variant-numeric:tabular-nums}
.loadmore{margin:12px auto;display:block}
/* ---- add ---- */
form.addf{display:flex;flex-direction:column;gap:10px;margin-top:8px}
form.addf label{font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
form.addf input,form.addf textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
form.addf textarea{min-height:64px;resize:vertical}
form.addf input:focus-visible,form.addf textarea:focus-visible{outline:2px solid var(--en)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px;background:var(--card);color:var(--ink-soft);border-radius:0}
.seg button.on{background:var(--ink);color:var(--paper)}
/* ---- stats ---- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:2.5px;background:var(--line);display:block}
.heat i.h1{background:color-mix(in srgb,var(--gold) 35%,var(--line))}
.heat i.h2{background:color-mix(in srgb,var(--gold) 65%,var(--line))}
.heat i.h3{background:var(--gold)}
.pbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px}
.prow{padding:12px 14px}
.prow .pl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.prow .pl b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-soft)}
.settings{margin-top:16px;padding:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.setrow:last-child{border-bottom:none}
.setrow input[type=number]{width:70px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:center}
textarea.io{width:100%;min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
/* ---- tabs ---- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 7px;border-radius:10px;color:var(--ink-soft);font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink-soft);padding:44px 20px;font-size:15px;line-height:1.6}
.donebox{text-align:center;padding:44px 20px}
.donebox .dt{font-size:26px;font-weight:700;margin-bottom:6px}
.donebox .ds{color:var(--ink-soft);line-height:1.6}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
@media (max-width:420px){ .rev .word{font-size:29px} .heat{grid-template-columns:repeat(26,1fr)} }
</style></head><body>
<div id="app">
  <header class="top">
    <div class="brand">拾遗<span class="lat">Lexicon</span></div>
    <div class="topstats">
      <span class="pill streak" id="pillStreak"><b>0</b> 天</span>
      <span class="pill" id="pillLv"><b>Lv.1</b></span>
      <svg class="ring" viewBox="0 0 34 34" id="goalRing" role="img" aria-label="daily goal">
        <circle class="bg" cx="17" cy="17" r="14" stroke-width="4"></circle>
        <circle class="fg" cx="17" cy="17" r="14" stroke-width="4" stroke-dasharray="88" stroke-dashoffset="88"></circle>
      </svg>
    </div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
</div>
<script>
"use strict";
const DECK = [{"w":"adduce","p":"uh-DOOS","d":"to cite as evidence or proof in an argument","t":"援引(证据)","c":[["deduce","to reach a conclusion by reasoning from general premises","演绎推出","From the footprints she deduced that two people had fled."],["induce","to bring about; to infer a general rule from particular cases","诱发;归纳","We induce laws from repeated observations."],["educe","to draw out something latent","引出(潜在之物)","Good questions educe what a student already half knows."]],"e":["The author adduces three archival letters in support of her claim."],"et":"作者援引三封档案信件来支持她的主张。","h":"ad-duce = lead (ducere) evidence TOWARD the argument; de-duce leads a conclusion DOWN from premises.","lang":"en","cat":"ac","pri":1,"id":"ac-adduce"},{"w":"posit","p":"POZ-it","d":"to put forward as a starting assumption for an argument","t":"假定;设定","c":[["pose","to present (a question, a problem); to adopt a stance","提出(问题);摆姿态","The ruling poses a problem for the theory."],["deposit","to put down or leave; to place in a bank","存放;沉积","The river deposits silt on the plain."]],"e":["The model posits a rational actor with stable preferences."],"et":"该模型假定存在一个偏好稳定的理性行动者。","h":"posit = POSITion a claim on the table; postulate is the formal, axiom-flavored cousin.","lang":"en","cat":"ac","pri":1,"id":"ac-posit"},{"w":"stipulate","p":"STIP-yuh-layt","d":"to specify as a condition or definition; to agree for the sake of argument","t":"约定;明确规定","c":[["postulate","to assume as a premise without proof","设为公设","The theory postulates a universal grammar."],["speculate","to form a theory without firm evidence","推测","We can only speculate about the author's motives."],["stimulate","to rouse to activity","刺激;激发","Low interest rates stimulate borrowing."]],"e":["The authors stipulate that 'literacy' here means the ability to sign one's name."],"et":"作者约定,此处的'识字'指能够签署自己的名字。","h":"stipulate = lay down the terms; speculate = guess; postulate = assume.","lang":"en","cat":"ac","pri":1,"id":"ac-stipulate"},{"w":"predicate","p":"PRED-ih-kayt","d":"(verb) to base something on; to affirm something of a subject (usually 'predicated on')","t":"以…为依据;断言","c":[["predict","to say in advance what will happen","预测","The model predicts a rise in turnout."],["predispose","to make inclined toward something in advance","使预先倾向于","Poverty predisposes children to illness."]],"e":["The whole argument is predicated on the assumption that voters are informed."],"et":"整个论证以选民知情这一假设为依据。","h":"The verb ends like 'date' (PRED-ih-kayt); the noun ends '-kit'. 'Predicated on' = resting on.","lang":"en","cat":"ac","pri":1,"id":"ac-predicate"},{"w":"presume","p":"prih-ZOOM","d":"to take as true on the basis of probability, or until disproved","t":"推定","c":[["assume","to take as true without evidence, for the sake of argument","(无据地)假设","Assume for a moment that prices are fixed."],["presuppose","to require as a prior condition; to take for granted in advance","预设","The question presupposes that a crime occurred."]],"e":["The law presumes innocence until guilt is proven."],"et":"法律推定无罪,直到罪行得到证明。","h":"presume = with some grounds; assume = with none; presuppose = logically required beforehand.","lang":"en","cat":"ac","pri":1,"id":"ac-presume"},{"w":"entail","p":"en-TAYL","d":"to involve as a necessary consequence; in logic, to imply strictly","t":"必然蕴涵","c":[["imply","to suggest without stating","暗示;意味着","Her tone implied doubt."],["implicate","to show to be involved; (pragmatics) to convey by implicature","牵连;(语用)隐含","The emails implicate two officials."],["entrain","to draw along with; to synchronize to a rhythm","带动;使同步","Daylight entrains the body's clock."]],"e":["Being a bachelor entails being unmarried."],"et":"是单身汉,就必然蕴涵着未婚。","h":"entail = the tail that must follow; imply may be only a hint.","lang":"en","cat":"ac","pri":1,"id":"ac-entail"},{"w":"construe","p":"kun-STROO","d":"to interpret or understand in a particular way","t":"解释;理解为","c":[["construct","to build or assemble","建构;建造","Each chapter constructs a different narrator."],["misconstrue","to interpret wrongly","误解","Critics misconstrued the irony as praise."]],"e":["The court construed the clause narrowly."],"et":"法院对该条款作了狭义解释。","h":"You construe a text and construct a building. Stress the second syllable.","lang":"en","cat":"ac","pri":1,"id":"ac-construe"},{"w":"explicate","p":"EK-splih-kayt","d":"to analyze and explain in detail, unfolding what is implicit","t":"详细阐释","c":[["extricate","to free from a difficulty or entanglement","使摆脱","He extricated himself from the contract."],["implicate","to show to be involved in","牵连","The audit implicated the treasurer."]],"e":["The seminar spent an hour explicating a single stanza."],"et":"研讨课花了一个小时细致阐释仅仅一节诗。","h":"ex-plic-ate = un-fold (plicare, to fold); im-plic-ate = fold in.","lang":"en","cat":"ac","pri":1,"id":"ac-explicate"},{"w":"elucidate","p":"ih-LOO-sih-dayt","d":"to make clear; to throw light on","t":"阐明","c":[["adumbrate","to sketch faintly; to foreshadow","勾勒;预示","The preface adumbrates the argument."],["elude","to escape; to fail to be grasped by","躲避;使想不起","The term eludes definition."]],"e":["The appendix elucidates how the sample was drawn."],"et":"附录阐明了样本是如何抽取的。","h":"e-LUC-idate: lux = light. Adumbrate has umbra, shadow, the dimmer opposite.","lang":"en","cat":"ac","pri":1,"id":"ac-elucidate"},{"w":"adumbrate","p":"AD-um-brayt","d":"to outline faintly; to foreshadow","t":"勾勒轮廓;预示","c":[["elucidate","to make fully clear","阐明","Later chapters elucidate the point."],["obfuscate","to make deliberately unclear","故意使模糊","Jargon obfuscates a weak argument."]],"e":["The introduction adumbrates themes developed in later chapters."],"et":"导言勾勒出后面各章展开的主题。","h":"ad-UMBRA-te: it casts a shadow ahead. An outline, not the full picture.","lang":"en","cat":"ac","pri":1,"id":"ac-adumbrate"},{"w":"expound","p":"ik-SPOWND","d":"to set out and explain in detail (a theory, a view)","t":"详述(观点)","c":[["propound","to put forward for consideration","提出(供讨论)","He propounded a new theory of rent."],["expand","to make or become larger","扩大;展开","She expanded the essay into a book."]],"e":["She expounds her theory of justice across three chapters."],"et":"她用三章的篇幅详述自己的正义理论。","h":"expound = explain at length what exists; propound = propose something new.","lang":"en","cat":"ac","pri":1,"id":"ac-expound"},{"w":"propound","p":"pruh-POWND","d":"to put forward (an idea, a theory) for consideration","t":"提出(供讨论)","c":[["expound","to explain in detail","详述","He expounded the doctrine to his students."],["compound","to combine; to make worse","复合;使加重","Delay compounded the error."]],"e":["Malthus propounded the view that population outruns food supply."],"et":"马尔萨斯提出了人口增长超过粮食供给的观点。","h":"pro-pound = put FORWARD; ex-pound = lay OUT.","lang":"en","cat":"ac","pri":1,"id":"ac-propound"},{"w":"gainsay","p":"gayn-SAY","d":"to deny or contradict (usually in negatives: 'no one can gainsay')","t":"否认;反驳","c":[["naysay","to oppose or express doubt habitually","唱反调","Critics naysay every reform."],["hearsay","information heard from others and not verified","传闻","The charge rests on hearsay."]],"e":["No one can gainsay the influence of the essay."],"et":"没有人能否认这篇文章的影响力。","h":"gain- here means 'against' (to say against). Nothing to do with gaining.","lang":"en","cat":"ac","pri":1,"id":"ac-gainsay"},{"w":"controvert","p":"KON-truh-vurt","d":"to dispute or argue against (a claim)","t":"争辩;驳斥","c":[["contravene","to violate (a rule, a law)","违反","The policy contravenes the treaty."],["convert","to change in form or belief","转变;皈依","The barn was converted into a studio."]],"e":["Later findings controvert the standard account."],"et":"后来的发现驳斥了通行的说法。","h":"You controvert a claim (think 'controversy') and contravene a rule.","lang":"en","cat":"ac","pri":1,"id":"ac-controvert"},{"w":"contravene","p":"kon-truh-VEEN","d":"to act against or conflict with (a law, a norm, a principle)","t":"违反;抵触","c":[["controvert","to dispute (a claim)","驳斥","Few would controvert the data."],["intervene","to come between so as to alter events","介入;干预","The state intervened in the market."]],"e":["The ordinance contravenes the constitutional right to assembly."],"et":"该条例违反了宪法规定的集会权。","h":"contra + venire: to COME AGAINST a rule.","lang":"en","cat":"ac","pri":1,"id":"ac-contravene"},{"w":"repudiate","p":"rih-PYOO-dee-ayt","d":"to reject as untrue, unjust or not binding; to disown","t":"拒绝接受;否定","c":[["refute","to prove false","驳倒","The experiment refuted the hypothesis."],["rebut","to argue against","反驳","Counsel rebutted the charge."],["repute","reputation; 'reputed' = generally said to be","名声","She is a scholar of high repute."]],"e":["She later repudiated her early structuralist work."],"et":"她后来否定了自己早期的结构主义著作。","h":"repudiate = disown; refute = disprove. You can repudiate what you cannot refute.","lang":"en","cat":"ac","pri":1,"id":"ac-repudiate"},{"w":"corroborate","p":"kuh-ROB-uh-rayt","d":"to confirm or support with further evidence","t":"佐证","c":[["collaborate","to work jointly","合作","The two labs collaborated on the survey."],["corrode","to wear away gradually","腐蚀","Distrust corrodes institutions."]],"e":["Interview data corroborate the survey findings."],"et":"访谈数据佐证了问卷调查的结论。","h":"cor-ROBOR-ate: robur = oak, strength (as in robust). It strengthens a claim.","lang":"en","cat":"ac","pri":1,"id":"ac-corroborate"},{"w":"substantiate","p":"sub-STAN-shee-ayt","d":"to provide evidence that proves a claim","t":"证实","c":[["instantiate","to represent by a concrete instance","例示","The case instantiates the general rule."],["substantive","(adjective) having real importance or content","实质性的","That is a substantive objection, not a quibble."]],"e":["The report fails to substantiate its central allegation."],"et":"这份报告未能证实其核心指控。","h":"substantiate gives a claim SUBSTANCE; instantiate gives it an INSTANCE.","lang":"en","cat":"ac","pri":1,"id":"ac-substantiate"},{"w":"instantiate","p":"in-STAN-shee-ayt","d":"to be or provide a concrete instance of an abstraction; to create an instance","t":"例示;实例化","c":[["substantiate","to prove with evidence","证实","Can you substantiate that figure?"],["instigate","to provoke or start (an action)","煽动;发起","He instigated the inquiry."]],"e":["Each object instantiates the class with its own parameters."],"et":"每个对象都以各自的参数将该类实例化。","h":"INSTANce-iate: make an instance of it.","lang":"en","cat":"ac","pri":1,"id":"ac-instantiate"},{"w":"evince","p":"ih-VINS","d":"to show clearly; to reveal (a quality, a feeling)","t":"表明;显露","c":[["evoke","to call up (a memory, a feeling)","唤起","The scent evokes childhood."],["evict","to expel from a property","驱逐","The tenants were evicted."],["convince","to persuade of a truth","使信服","The data convinced the skeptics."]],"e":["The letters evince a growing disillusionment with the party."],"et":"这些信件显露出对该党日益加深的幻灭。","h":"evince = make evident in oneself; evoke = call up in someone else.","lang":"en","cat":"ac","pri":1,"id":"ac-evince"},{"w":"invoke","p":"in-VOHK","d":"to cite or appeal to as authority or justification; to call on","t":"援引;诉诸","c":[["evoke","to call up (a feeling, an image)","唤起","The novel evokes prewar Vienna."],["provoke","to stir up (a reaction)","激起","The essay provoked a backlash."]],"e":["The author invokes Foucault to justify the periodization."],"et":"作者援引福柯来为这一分期辩护。","h":"IN-voke: call IN an authority; E-voke: call OUT a feeling.","lang":"en","cat":"ac","pri":1,"id":"ac-invoke"},{"w":"belie","p":"bih-LY","d":"to give a false impression of; to show to be false","t":"掩饰;与…不符","c":[["betray","to reveal unintentionally; to be disloyal to","泄露;背叛","His voice betrayed his nerves."],["belay","to secure (a rope); to stop","系牢;停止","Belay the line to the cleat."]],"e":["The calm prose belies the radicalism of the argument, which few first readers noticed."],"et":"平静的文字掩盖了论证的激进,初读者很少察觉。","h":"be-LIE: the surface tells a lie. Betray is the opposite: it lets the truth slip.","lang":"en","cat":"ac","pri":1,"id":"ac-belie"},{"w":"purport","p":"pur-PORT","d":"to claim or appear to be or do something, often falsely","t":"声称;意在","c":[["purpose","an aim or intention","目的","The purpose of the study is modest."],["report","to give an account of","报告","The paper reports two experiments."]],"e":["The index purports to measure democratic quality."],"et":"该指数声称能衡量民主质量。","h":"'purports to' = claims to, with a raised eyebrow.","lang":"en","cat":"ac","pri":1,"id":"ac-purport"},{"w":"surmise","p":"sur-MYZE","d":"to infer without strong evidence; to guess","t":"推测","c":[["summarize","to state the main points briefly","概括","The abstract summarizes the findings."],["surmount","to overcome","克服","They surmounted the funding gap."]],"e":["We can only surmise why the passage was deleted."],"et":"那段文字为何被删,我们只能推测。","h":"sur-MISE: a thought sent (as in missile) out over thin evidence.","lang":"en","cat":"ac","pri":1,"id":"ac-surmise"},{"w":"interpellate","p":"in-TUR-puh-layt","d":"(Althusser) to hail someone into a subject position through ideology; to question formally","t":"(意识形态)询唤","c":[["interpolate","to insert into a text; to estimate between known values","插入;内插","A later scribe interpolated the verse."],["interpret","to explain the meaning of","解释","Readers interpret the ending differently."]],"e":["Advertising interpellates viewers as consumers."],"et":"广告把观众询唤为消费者。","h":"inter-PELL-ate: French appeler, to call ('Hey, you!'). inter-POL-ate slips something in.","lang":"en","cat":"ac","pri":1,"id":"ac-interpellate"},{"w":"reify","p":"REE-uh-fy","d":"to treat an abstraction as if it were a concrete thing","t":"物化;具体化","c":[["deify","to treat as a god","神化","The cult deified its founder."],["rarefy","to make thin or refined","使稀薄;使精纯","The debate grew rarefied and remote."],["ratify","to approve formally","批准","The senate ratified the treaty."]],"e":["The census reifies ethnic categories that were once fluid."],"et":"人口普查把原本流动的族群类别物化了。","h":"re-ify: res = thing (as in real, republic). To make a thing of it.","lang":"en","cat":"ac","pri":1,"id":"ac-reify"},{"w":"hypostatize","p":"hy-POS-tuh-tyze","d":"to treat a concept as a distinct substance or reality","t":"实体化","c":[["hypothesize","to propose as a hypothesis","提出假设","We hypothesize a causal link."],["hypothecate","to pledge as security without giving up possession","抵押","The firm hypothecated its inventory."]],"e":["Critics charge that the theory hypostatizes 'culture' as an agent."],"et":"批评者指责该理论把'文化'实体化为一个能动者。","h":"hypo-STASIS = what stands under: giving an idea a substance of its own. Reify is the near-synonym.","lang":"en","cat":"ac","pri":1,"id":"ac-hypostatize"},{"w":"subsume","p":"sub-SOOM","d":"to include or absorb under a broader category or rule","t":"归入;涵摄","c":[["assume","to take as true without proof","假设","Assume equal variances."],["consume","to use up; to eat","消耗","The project consumed the budget."],["resume","to begin again","重新开始","Talks resumed in May."]],"e":["The new framework subsumes both earlier models as special cases."],"et":"新框架把先前两个模型都作为特例涵摄在内。","h":"sub-SUME: take (sumere) UNDER a larger heading.","lang":"en","cat":"ac","pri":1,"id":"ac-subsume"},{"w":"sublate","p":"sub-LAYT","d":"(Hegel's aufheben) to negate and preserve at a higher level","t":"扬弃","c":[["sublimate","to redirect an impulse into a higher activity","升华","He sublimated grief into work."],["subsume","to include under a wider category","归入","Class is subsumed under identity."]],"e":["For Hegel, each stage is sublated rather than simply discarded."],"et":"在黑格尔看来,每个阶段是被扬弃,而不是被简单丢弃。","h":"sub-LATE = lifted up (latus, carried): cancelled, kept and raised at once.","lang":"en","cat":"ac","pri":1,"id":"ac-sublate"},{"w":"sublimate","p":"SUB-lih-mayt","d":"to divert an impulse into a socially valued form; (chemistry) to pass from solid to gas","t":"升华","c":[["sublate","to negate yet preserve (Hegel)","扬弃","The antithesis is sublated in the synthesis."],["sublime","(adjective) awe-inspiringly grand","崇高的","Kant analyzed the sublime."],["subliminal","below the threshold of awareness","潜意识的","Subliminal cues shaped the choice."]],"e":["Freud held that artists sublimate desire into form."],"et":"弗洛伊德认为,艺术家把欲望升华为形式。","h":"Freud's sublimate, Hegel's sublate, Kant's sublime: three thinkers, three words.","lang":"en","cat":"ac","pri":1,"id":"ac-sublimate"},{"w":"conflate","p":"kun-FLAYT","d":"to merge two distinct things into one, usually by mistake","t":"混为一谈","c":[["confuse","to mistake one for another; to bewilder","混淆;使困惑","Readers confuse the two authors."],["collate","to gather and put in order or compare","整理校对","She collated the manuscripts."],["inflate","to blow up; to exaggerate","使膨胀;夸大","The small sample inflates the effect."]],"e":["The essay conflates two distinct senses of 'freedom' into one."],"et":"这篇文章把'自由'的两种不同含义混为一谈。","h":"con-FLATE: blow (flare) two things TOGETHER into one.","lang":"en","cat":"ac","pri":1,"id":"ac-conflate"},{"w":"valorize","p":"VAL-uh-ryze","d":"to give or ascribe value or validity to; to exalt","t":"赋予价值;推崇","c":[["validate","to confirm as sound or legitimate","验证;认可","The scale was validated on a new sample."],["vulgarize","to make coarse; to popularize crudely","使庸俗化","The film vulgarizes the novel."]],"e":["Romanticism valorizes spontaneity over craft."],"et":"浪漫主义推崇自发胜于技艺。","h":"valorize treats something as having worth; validate checks whether it holds.","lang":"en","cat":"ac","pri":1,"id":"ac-valorize"},{"w":"operationalize","p":"op-uh-RAY-shun-uh-lyze","d":"to define a concept in terms of measurable procedures","t":"操作化","c":[["conceptualize","to form an abstract idea of","概念化","Trust is conceptualized as an expectation."],["operate","to function; to run","运作;操作","The clinic operates on donations."]],"e":["Trust is operationalized as the share of money returned in the game."],"et":"信任被操作化为博弈中返还金额的比例。","h":"conceptualize first (what is it?), operationalize second (how do we measure it?).","lang":"en","cat":"ac","pri":1,"id":"ac-operationalize"},{"w":"overdetermine","p":"oh-vur-dih-TUR-min","d":"to cause by more than one sufficient factor (Freud, Althusser)","t":"多重决定","c":[["predetermine","to decide or fix in advance","预先决定","The outcome was predetermined."],["underdetermine","to leave not fully settled by the evidence","不足以决定","The data underdetermine the theory."]],"e":["The revolution was overdetermined by economic, military and ideological crises."],"et":"这场革命是由经济、军事与意识形态危机多重决定的。","h":"over = too many causes; under = too little evidence; pre = too early.","lang":"en","cat":"ac","pri":1,"id":"ac-overdetermine"},{"w":"circumscribe","p":"SUR-kum-skrybe","d":"to restrict within limits; to draw a boundary around","t":"限定;划界","c":[["circumvent","to find a way around","规避","Firms circumvent the rule."],["circumspect","(adjective) wary, cautious","谨慎的","She gave a circumspect reply."]],"e":["The study's claims are circumscribed by its small sample."],"et":"这项研究的结论受其小样本所限。","h":"circum-SCRIBE: write a circle around it.","lang":"en","cat":"ac","pri":1,"id":"ac-circumscribe"},{"w":"delineate","p":"dih-LIN-ee-ayt","d":"to describe or mark out precisely","t":"勾画;界定","c":[["delimit","to fix the boundaries of","划定界限","The treaty delimits the zone."],["demarcate","to set apart by a clear boundary","划界区分","Popper sought to demarcate science from pseudoscience."]],"e":["Chapter two delineates the three phases of reform."],"et":"第二章勾画出改革的三个阶段。","h":"de-LINE-ate: draw the lines of it; delimit: set its limits.","lang":"en","cat":"ac","pri":1,"id":"ac-delineate"},{"w":"inflect","p":"in-FLEKT","d":"to color or modify (humanities: 'inflected by'); to change the form of a word","t":"使带上…色彩;屈折","c":[["infect","to contaminate with disease","感染","The wound was infected."],["inflict","to impose (harm) on","施加","Sanctions inflict costs on exporters."],["reflect","to mirror; to think carefully","反映;思考","Prices reflect scarcity."]],"e":["Her reading of Marx is inflected by feminist theory."],"et":"她对马克思的解读带有女性主义理论的色彩。","h":"in-FLECT = bend (as in flex): one view bent by another.","lang":"en","cat":"ac","pri":1,"id":"ac-inflect"},{"w":"imbricate","p":"IM-brih-kayt","d":"to overlap like roof tiles; (theory) to be closely interwoven","t":"交叠;层层嵌套","c":[["implicate","to show to be involved","牵连","Race is implicated in the policy."],["imbue","to fill with a quality","灌注","The text is imbued with irony."]],"e":["In her account, race and class are imbricated with one another at every level."],"et":"在她的论述中,种族与阶级在每个层面上都彼此交叠。","h":"imbrex = roof tile: overlapping, not merely adjacent.","lang":"en","cat":"ac","pri":1,"id":"ac-imbricate"},{"w":"imbue","p":"im-BYOO","d":"to permeate or inspire with a quality or feeling","t":"灌注;使充满","c":[["imbrue","to stain, especially with blood","沾染(血)","His hands were imbrued with blood."],["instill","to introduce gradually into the mind","逐渐灌输","Schools instill habits."]],"e":["The ritual is imbued with political meaning."],"et":"这一仪式充满了政治意涵。","h":"You imbue the THING with a quality; you instill the quality INTO a person. Infuse is the near-synonym.","lang":"en","cat":"ac","pri":1,"id":"ac-imbue"},{"w":"inculcate","p":"IN-kul-kayt","d":"to teach by persistent repetition","t":"反复灌输","c":[["inculpate","to incriminate","归罪","The letter inculpates the minister."],["incubate","to keep warm for hatching; to develop","孵化;培育","The lab incubates new firms."]],"e":["The schools inculcated loyalty to the empire."],"et":"这些学校反复灌输对帝国的忠诚。","h":"in-CULC-ate: calx = heel. Stamp it in.","lang":"en","cat":"ac","pri":1,"id":"ac-inculcate"},{"w":"inhere","p":"in-HEER","d":"to exist as an essential, permanent part (inhere IN)","t":"内在于","c":[["adhere","to stick to; to follow","粘附;遵守","Members adhere to the code."],["cohere","to hold together logically","连贯","The chapters do not cohere."],["inherit","to receive from a predecessor","继承","The state inherited colonial borders."]],"e":["Meaning does not inhere in the text but arises in reading."],"et":"意义并非内在于文本,而是在阅读中生成。","h":"in-here sticks IN; ad-here sticks TO; co-here sticks TOGETHER.","lang":"en","cat":"ac","pri":1,"id":"ac-inhere"},{"w":"ascribe","p":"uh-SKRYBE","d":"to attribute to a cause, an author or a source","t":"归于","c":[["describe","to give an account of","描述","The table describes the sample."],["subscribe","to agree with (subscribe to a view)","赞同","Few subscribe to that theory."],["inscribe","to write or carve on; to embed","铭刻","Power is inscribed on the body."]],"e":["The poem was long ascribed to Li Bai."],"et":"这首诗长期被归于李白名下。","h":"a-SCRIBE: write it TO someone's account.","lang":"en","cat":"ac","pri":1,"id":"ac-ascribe"},{"w":"appropriate","p":"uh-PROH-pree-ayt","d":"(verb) to take for one's own use, often without permission; to adopt and repurpose","t":"挪用;占用","c":[["expropriate","(of a state) to take property from its owner","征收;没收","The regime expropriated the estates."],["misappropriate","to take dishonestly for one's own use","侵吞","He misappropriated the funds."]],"e":["Pop artists appropriate images from advertising."],"et":"波普艺术家挪用广告中的图像。","h":"The verb ends like 'late'; the adjective ends '-it'.","lang":"en","cat":"ac","pri":1,"id":"ac-appropriate"},{"w":"efface","p":"ih-FAYS","d":"to erase or make inconspicuous","t":"抹去;使隐没","c":[["deface","to spoil the surface of","污损","Vandals defaced the mural."],["outface","to confront boldly; to stare down","泰然面对;压倒","She outfaced her critics."]],"e":["Translation can efface the labor of the translator."],"et":"翻译可能抹去译者的劳动。","h":"ef-FACE: rub the face OFF; de-face: spoil the face.","lang":"en","cat":"ac","pri":1,"id":"ac-efface"},{"w":"recuperate","p":"rih-KOO-puh-rayt","d":"(theory) to recover or co-opt for a tradition or system; to regain health","t":"重新收编;挽回","c":[["recoup","to regain (a loss, a cost)","收回(损失)","The studio recouped its costs."],["recover","to get back; to return to health","恢复;找回","The archive recovered lost voices."]],"e":["The avant-garde gesture was soon recuperated by the market."],"et":"这一先锋姿态很快就被市场收编了。","h":"In theory writing, recuperated often means 'absorbed back into the system'.","lang":"en","cat":"ac","pri":1,"id":"ac-recuperate"},{"w":"rehearse","p":"rih-HURS","d":"(academic) to recount or go over again, especially familiar arguments","t":"复述(论点)","c":[["reverse","to turn back; to overturn","推翻;倒转","The court reversed the ruling."],["hearse","a vehicle that carries a coffin","灵车","The hearse led the procession."]],"e":["I will not rehearse the familiar objections here."],"et":"我不在此复述那些熟悉的反对意见。","h":"Not theatre: 'to rehearse an argument' is to run through it again. Reiterate says it again for emphasis; rehash serves it up stale.","lang":"en","cat":"ac","pri":1,"id":"ac-rehearse"},{"w":"foreclose","p":"for-KLOHZ","d":"to rule out or shut off in advance; to repossess mortgaged property","t":"排除(可能性)","c":[["forestall","to prevent by acting first","预先阻止","The memo forestalled criticism."],["disclose","to make known","披露","The firm disclosed the breach."]],"e":["Defining the term so narrowly forecloses other readings."],"et":"把这个术语定义得如此狭窄,就排除了其他解读。","h":"fore-CLOSE: close the door before anyone gets there. Preclude is the near-synonym.","lang":"en","cat":"ac","pri":1,"id":"ac-foreclose"},{"w":"forestall","p":"for-STAWL","d":"to prevent or delay by acting in advance","t":"预先阻止","c":[["foreclose","to shut off (an option) in advance","排除","The ruling forecloses appeal."],["install","to put in place","安装;任命","The junta installed a governor."]],"e":["The government cut taxes to forestall unrest."],"et":"政府减税以预先防止动荡。","h":"Set up your STALL beFORE the others arrive.","lang":"en","cat":"ac","pri":1,"id":"ac-forestall"},{"w":"preclude","p":"prih-KLOOD","d":"to prevent from happening; to make impossible","t":"使不可能","c":[["exclude","to keep out","排除在外","Minors were excluded from the sample."],["occlude","to block or hide","遮蔽;阻塞","Clouds occlude the sun."],["prelude","an introductory event or piece","前奏","The strike was a prelude to war."]],"e":["The small sample precludes any causal claim."],"et":"样本太小,无法做出任何因果论断。","h":"pre-CLUDE: shut (claudere) beforehand.","lang":"en","cat":"ac","pri":1,"id":"ac-preclude"},{"w":"occlude","p":"uh-KLOOD","d":"to block, obstruct or hide from view","t":"遮蔽;阻塞","c":[["preclude","to make impossible","使不可能","Cost precludes a larger trial."],["exclude","to leave out","排除","The index excludes rents."]],"e":["The focus on elites occludes the role of ordinary workers."],"et":"对精英的关注遮蔽了普通工人的作用。","h":"oc-CLUDE: close over. In vision research an occluded object is hidden behind another.","lang":"en","cat":"ac","pri":1,"id":"ac-occlude"},{"w":"supersede","p":"soo-pur-SEED","d":"to take the place of something older or inferior","t":"取代","c":[["supervene","to occur as an interruption; (philosophy) to depend on lower-level facts","意外发生;随附","Mental states supervene on physical states."],["surpass","to exceed; to be better than","超过","Output surpassed forecasts."]],"e":["The 2019 guidelines supersede all earlier versions."],"et":"2019年的准则取代此前所有版本。","h":"super-SEDE (sedere, to sit above): the only English word that ends in -sede. Supplant means the same but implies force or scheming.","lang":"en","cat":"ac","pri":1,"id":"ac-supersede"},{"w":"supplant","p":"suh-PLANT","d":"to displace and replace","t":"排挤并取代","c":[["supplement","to add to","补充","Interviews supplement the survey."],["supplicate","to beg humbly","恳求","They supplicated the court for mercy."]],"e":["Print never wholly supplanted manuscript culture."],"et":"印刷术从未完全取代手抄文化。","h":"sup-PLANT: trip up (planta = sole of the foot) and take the place.","lang":"en","cat":"ac","pri":1,"id":"ac-supplant"},{"w":"vitiate","p":"VISH-ee-ayt","d":"to impair the quality or validity of; to spoil","t":"削弱;使无效","c":[["initiate","to begin","发起","The ministry initiated a review."],["vitrify","to turn into glass","使玻璃化","Heat vitrified the sand."]],"e":["Selection bias vitiates the study's conclusions."],"et":"选择偏差使这项研究的结论失效。","h":"VITI-ate: vitium = fault (as in vice, vicious).","lang":"en","cat":"ac","pri":1,"id":"ac-vitiate"},{"w":"attenuate","p":"uh-TEN-yoo-ayt","d":"to reduce in force, effect or thickness","t":"减弱;使变细","c":[["extenuate","to make (a fault) seem less serious","(为过失)减轻","Nothing extenuates the fraud."],["accentuate","to make more noticeable","强调;突出","The crisis accentuated the divide."]],"e":["Controlling for income attenuates the effect by half."],"et":"控制收入之后,该效应减弱了一半。","h":"at-TENU-ate: make tenuous, thin.","lang":"en","cat":"ac","pri":1,"id":"ac-attenuate"},{"w":"extenuate","p":"ik-STEN-yoo-ayt","d":"to lessen the seriousness of an offense by partial excuse","t":"(为过失)减轻","c":[["attenuate","to weaken","减弱","Distance attenuates the signal."],["exonerate","to clear from blame","免除罪责","The inquiry exonerated her."]],"e":["Poverty may extenuate the offense but does not excuse it."],"et":"贫困或可减轻这一过失,却不能为之开脱。","h":"Extenuating circumstances lessen blame; exonerating evidence removes it.","lang":"en","cat":"ac","pri":1,"id":"ac-extenuate"},{"w":"ameliorate","p":"uh-MEEL-yuh-rayt","d":"to make something bad better","t":"改善","c":[["alleviate","to make (pain, hardship) less severe","缓解","Aid alleviated the famine."],["palliate","to ease symptoms without curing; to gloss over","治标;掩饰","The reform palliates rather than cures."]],"e":["The reforms ameliorated conditions in the factories."],"et":"这些改革改善了工厂里的条件。","h":"a-MELIOR-ate: melior = better. It improves the situation itself, not just the pain.","lang":"en","cat":"ac","pri":1,"id":"ac-ameliorate"},{"w":"derogate","p":"DAIR-uh-gayt","d":"to detract from; to deviate from (derogate FROM a norm or right)","t":"贬损;背离","c":[["denigrate","to criticize unfairly; to belittle","诋毁","He denigrated his rivals."],["derogatory","(adjective) disrespectful","贬损的","It was a derogatory nickname."]],"e":["States may derogate from certain rights in an emergency."],"et":"紧急状态下,国家可以克减某些权利。","h":"In law, to derogate from a right is to depart from it; to abrogate it is to abolish it.","lang":"en","cat":"ac","pri":1,"id":"ac-derogate"},{"w":"promulgate","p":"PROM-ul-gayt","d":"to make widely known; to put a law into effect by proclamation","t":"颁布;传播","c":[["propagate","to spread; to reproduce","传播;繁殖","Errors propagate through the model."],["propitiate","to appease","安抚","Offerings propitiated the spirits."]],"e":["The code was promulgated in 1804."],"et":"这部法典于1804年颁布。","h":"You promulgate a law and propagate a belief (or a gradient).","lang":"en","cat":"ac","pri":1,"id":"ac-promulgate"},{"w":"ablate","p":"uh-BLAYT","d":"to remove a component in order to measure its contribution (ablation study); to remove tissue","t":"消融(去除部件以测其作用)","c":[["abate","to lessen","减弱","The storm abated."],["abrade","to scrape away","磨损","Sand abraded the lens."],["oblate","(adjective) flattened at the poles","扁球形的","The Earth is an oblate spheroid."]],"e":["We ablate each attention head to measure its contribution."],"et":"我们逐一消融各注意力头,以衡量其贡献。","h":"ab-LATE: carried away (latus). An ablation study takes parts out one at a time.","lang":"en","cat":"ac","pri":1,"id":"ac-ablate"},{"w":"perturb","p":"pur-TURB","d":"to alter slightly from a normal state; to unsettle","t":"扰动","c":[["disturb","to interrupt or upset","打扰;扰乱","Noise disturbed the session."],["pervert","to distort or corrupt","歪曲;败坏","The incentive perverts the measure."]],"e":["We perturb each input pixel and observe the change in output."],"et":"我们扰动每个输入像素,并观察输出的变化。","h":"The noun is perturbation. Small deliberate nudges, not disruption.","lang":"en","cat":"ac","pri":1,"id":"ac-perturb"},{"w":"distill","p":"dih-STIL","d":"to extract the essential part; (machine learning) to train a small model to mimic a large one","t":"蒸馏;提炼","c":[["instill","to introduce gradually into a mind","逐渐灌输","Parents instill values."],["still","(verb) to make calm or quiet","使平静","The speech stilled the crowd."]],"e":["The large model is distilled into a smaller student network."],"et":"大模型被蒸馏成一个较小的学生网络。","h":"dis-TILL: drip DOWN and out; in-STILL: drip IN.","lang":"en","cat":"ac","pri":1,"id":"ac-distill"},{"w":"convolve","p":"kun-VOLV","d":"to combine two functions by convolution","t":"做卷积","c":[["convolute","(usually 'convoluted') intricately twisted, overly complex","盘绕复杂的","It was a convoluted argument."],["involve","to include as a part","涉及","The task involves planning."],["evolve","to develop gradually","演化","Norms evolve slowly."]],"e":["Each filter is convolved with the input image."],"et":"每个滤波器都与输入图像做卷积。","h":"The verb of convolution is convolve, not 'convolute'.","lang":"en","cat":"ac","pri":1,"id":"ac-convolve"},{"w":"confabulate","p":"kun-FAB-yuh-layt","d":"to produce fabricated details without intent to deceive (of memory, or of language models)","t":"虚构(幻觉)","c":[["confiscate","to seize by authority","没收","Police confiscated the files."],["conflate","to merge two things mistakenly","混为一谈","He conflates fame with merit."]],"e":["Asked for a source, the model confabulated a plausible citation."],"et":"被问到出处时,模型虚构了一条看似可信的引文。","h":"con-FABUL-ate: fabula = story. Story-making without knowing it. Unlike fabricate, there is no intent to deceive; in AI writing it is a more exact word than hallucinate.","lang":"en","cat":"ac","pri":1,"id":"ac-confabulate"},{"w":"disambiguate","p":"dis-am-BIG-yoo-ayt","d":"to remove ambiguity; to determine which sense is meant","t":"消歧","c":[["disaggregate","to separate into component parts","分解(数据)","Disaggregate the data by region."],["disabuse","to free from a false belief","纠正误解","Let me disabuse you of that idea."]],"e":["Context helps the model disambiguate 'bank'."],"et":"上下文帮助模型消除'bank'一词的歧义。","h":"dis-AMBIGU-ate: take the ambiguity out.","lang":"en","cat":"ac","pri":1,"id":"ac-disambiguate"},{"w":"regularize","p":"REG-yuh-luh-ryze","d":"(machine learning) to add a penalty that discourages overly complex models; to make regular or lawful","t":"正则化","c":[["regulate","to control by rules","监管;调节","The agency regulates banks."],["normalize","to rescale to a standard range; to make normal","归一化;正常化","Normalize each feature to unit variance."],["standardize","to make conform to a standard","标准化","Standardize the test conditions."]],"e":["We regularize the weights to prevent overfitting."],"et":"我们对权重做正则化,以防止过拟合。","h":"You regularize the MODEL (a penalty) and normalize the DATA (a rescaling).","lang":"en","cat":"ac","pri":1,"id":"ac-regularize"},{"w":"marginalize","p":"MAR-jih-nuh-lyze","d":"to push to the edge of importance; (statistics) to sum or integrate out a variable","t":"边缘化;(统计)求边缘分布","c":[["minimize","to reduce to the smallest amount; to play down","最小化;淡化","Minimize the loss function."],["trivialize","to make seem unimportant","轻视","The report trivializes the risk."]],"e":["To obtain the likelihood, we marginalize out the latent variable."],"et":"为得到似然,我们把隐变量边缘化掉。","h":"Two worlds, one word: marginalized groups (sociology) and marginalizing a variable (probability).","lang":"en","cat":"ac","pri":1,"id":"ac-marginalize"},{"w":"extrapolate","p":"ik-STRAP-uh-layt","d":"to extend a trend or conclusion beyond the observed range","t":"外推","c":[["interpolate","to estimate between known values","内插","Interpolate the missing months."],["extricate","to free from entanglement","使摆脱","She extricated the files from the old system."]],"e":["It is risky to extrapolate from a single case."],"et":"从单个案例外推是有风险的。","h":"EXTRA-polate: outside the data; INTER-polate: between the points.","lang":"en","cat":"ac","pri":1,"id":"ac-extrapolate"},{"w":"interpolate","p":"in-TUR-puh-layt","d":"to estimate values between known points; to insert words into a text","t":"内插;插入文字","c":[["extrapolate","to extend beyond the known range","外推","Do not extrapolate past 2030."],["interpellate","to hail into a subject position (Althusser)","询唤","Ideology interpellates individuals as subjects."]],"e":["Missing years were interpolated from adjacent censuses."],"et":"缺失年份的数据由相邻的普查内插而得。","h":"Philologists use it too: an interpolated line is one a later hand slipped in.","lang":"en","cat":"ac","pri":1,"id":"ac-interpolate"},{"w":"mediate","p":"MEE-dee-ayt","d":"to act as the mechanism through which X affects Y; to intervene between parties","t":"中介;调解","c":[["moderate","(statistics) to change the strength or direction of an effect","调节(效应)","Gender moderates the effect."],["meditate","to think deeply; to practice meditation","沉思;冥想","He meditated on the passage."]],"e":["Income raises happiness through self-esteem: self-esteem mediates the effect."],"et":"收入通过自尊提升幸福感:自尊在其中起中介作用。","h":"A mediator explains HOW (X to M to Y); a moderator tells WHEN or FOR WHOM.","lang":"en","cat":"ac","pri":1,"id":"ac-mediate"},{"w":"confound","p":"kun-FOWND","d":"(statistics) to distort an apparent relationship through a third variable; to baffle","t":"混淆(变量);使困惑","c":[["compound","to make worse; to combine","使加重;复合","Missing data compound the problem."],["confuse","to mix up; to bewilder","混淆;使困惑","Do not confuse the two indices."]],"e":["Age confounds the relationship between coffee and heart disease."],"et":"年龄混淆了咖啡与心脏病之间的关系。","h":"A confounder causes both X and Y: it pours (fundere) them together.","lang":"en","cat":"ac","pri":1,"id":"ac-confound"},{"w":"comprise","p":"kum-PRYZE","d":"to consist of; to be made up of (the whole comprises the parts)","t":"包含;由…组成","c":[["compose","to make up (the parts compose the whole)","组成","Nine chapters compose the volume."],["constitute","to form or amount to","构成","Women constitute half the sample."]],"e":["The corpus comprises four thousand letters."],"et":"该语料库包含四千封信。","h":"The whole comprises the parts; the parts compose the whole. Careful editors avoid 'comprised of'.","lang":"en","cat":"ac","pri":1,"id":"ac-comprise"},{"w":"effect","p":"ih-FEKT","d":"(verb) to bring about; to cause to happen","t":"促成;实现","c":[["affect","to influence; (noun, psychology) emotion","影响;情感","The policy affected turnout."],["defect","a flaw; (verb) to desert to the other side","缺陷;叛逃","Two officers defected."]],"e":["The movement effected a lasting change in labor law."],"et":"这场运动促成了劳动法的持久变革。","h":"To effect change is to produce it; to affect change is to alter a change already under way.","lang":"en","cat":"ac","pri":1,"id":"ac-effect"},{"w":"obtain","p":"ub-TAYN","d":"(with no object, formal) to be in force, to be the case, to prevail; (with an object) to get","t":"(情况)成立;通行","c":[["attain","to reach or achieve","达到","Few attain fluency."],["pertain","to relate to","与…有关","These rules pertain to tenure."]],"e":["The same conditions obtain in rural districts."],"et":"同样的情况在农村地区也成立。","h":"'The conditions that obtain' = the conditions that hold. No object: nothing is being got.","lang":"en","cat":"ac","pri":1,"id":"ac-obtain"},{"w":"enjoin","p":"en-JOYN","d":"to instruct or urge (enjoin someone TO); in law, to prohibit by injunction (enjoin FROM)","t":"责令;禁止","c":[["adjoin","to be next to","毗邻","The archive adjoins the library."],["conjoin","to join together","结合","The essay conjoins two debates."]],"e":["The court enjoined the company from selling the data."],"et":"法院禁止该公司出售这些数据。","h":"enjoin TO = order; enjoin FROM = forbid. Watch the preposition.","lang":"en","cat":"ac","pri":1,"id":"ac-enjoin"},{"w":"sanction","p":"SANGK-shun","d":"to give official approval to; or (especially of states) to penalize","t":"批准;制裁","c":[["sanctify","to make holy or legitimate","使神圣;使正当","Custom sanctifies the practice."],["censure","to condemn formally","谴责","The board censured the director."]],"e":["The council sanctioned the use of force, giving the mission its legal basis."],"et":"理事会批准了使用武力,为这次行动提供了法律依据。","h":"A word with two opposite senses: a sanctioned practice is approved, a sanctioned country is punished.","lang":"en","cat":"ac","pri":1,"id":"ac-sanction"},{"w":"peruse","p":"puh-ROOZ","d":"to read thoroughly and carefully (not to skim)","t":"细读","c":[["pursue","to follow or chase; to carry on with","追求;继续进行","She pursued the question for a decade."],["skim","to read quickly for the main points","略读","I skimmed the abstract."]],"e":["She perused the contract line by line."],"et":"她逐行细读了那份合同。","h":"per- = thoroughly. Peruse is the opposite of skim, despite common usage.","lang":"en","cat":"ac","pri":1,"id":"ac-peruse"},{"w":"home in","p":"HOHM in","d":"to move or aim precisely toward a target (home in ON)","t":"瞄准;聚焦","c":[["hone","to sharpen (a skill, a blade)","磨炼;磨快","She honed her argument."],["hem in","to surround and restrict","围困;限制","The clause hems in the regulator."]],"e":["Later chapters home in on the question of consent."],"et":"后面几章聚焦于同意这一问题。","h":"Missiles and pigeons HOME in; you HONE a skill. 'Hone in on' is the common slip. 'Zero in on' means the same.","lang":"en","cat":"ac","pri":1,"id":"ac-home in"},{"w":"forgo","p":"for-GOH","d":"to go without; to give up","t":"放弃","c":[["forego","to go before, to precede (as in 'the foregoing')","在…之前","The foregoing analysis shows two patterns."],["forge","to make; to fake","锻造;伪造","The two states forged an alliance."]],"e":["Respondents were willing to forgo income for more leisure."],"et":"受访者愿意放弃收入以换取更多闲暇。","h":"for-go = go without; fore-go = go before (hence 'a foregone conclusion').","lang":"en","cat":"ac","pri":1,"id":"ac-forgo"},{"w":"epistemic","p":"ep-ih-STEE-mik","d":"relating to knowledge or to the degree of its validation","t":"认知的;知识的","c":[["epistemological","relating to the theory of knowledge as a field of study","认识论的","It is an epistemological debate about induction."],["ontic","relating to what really exists","存在者层面的","The limit is ontic, not a matter of what we know."]],"e":["The model reports its epistemic uncertainty separately."],"et":"模型单独报告它的认知不确定性。","h":"epistemic = about knowing; epistemological = about the THEORY of knowing.","lang":"en","cat":"ac","pri":1,"id":"ac-epistemic"},{"w":"tendentious","p":"ten-DEN-shus","d":"promoting a particular point of view; biased","t":"有倾向性的","c":[["tenuous","thin, weak, insubstantial","薄弱的","The link is tenuous at best."],["contentious","causing or fond of argument","有争议的;好争的","It remains a contentious claim."]],"e":["The summary is tendentious, omitting every dissenting source."],"et":"这份摘要带有倾向性,略去了所有持异议的资料。","h":"tendentious has a TENDENCY; contentious starts a CONTEST; tenuous is THIN.","lang":"en","cat":"ac","pri":1,"id":"ac-tendentious"},{"w":"apposite","p":"AP-uh-zit","d":"apt; highly relevant to the matter","t":"贴切的","c":[["opposite","completely different; facing","相反的","They reached the opposite conclusion."],["appositive","a noun phrase set beside another to rename it","同位语","In 'Li Bai, the poet', 'the poet' is an appositive."]],"e":["The comparison with Weimar is apposite."],"et":"与魏玛共和国相比较,是很贴切的。","h":"ap-POSITE: placed (posit) right TO the point.","lang":"en","cat":"ac","pri":1,"id":"ac-apposite"},{"w":"ostensible","p":"os-TEN-suh-bul","d":"stated or appearing to be true, but possibly not so","t":"表面上的","c":[["ostensive","defining by pointing or showing","明示的(指物定义)","Pointing at a tomato gives an ostensive definition of 'red'."],["ostentatious","showy, designed to impress","炫耀的","It was an ostentatious display of wealth."]],"e":["The ostensible aim of the survey was to measure satisfaction."],"et":"这项调查表面上的目的是衡量满意度。","h":"ostendere = to show: what is shown on the surface, with a hint of doubt.","lang":"en","cat":"ac","pri":1,"id":"ac-ostensible"},{"w":"putative","p":"PYOO-tuh-tiv","d":"generally supposed or assumed to be","t":"公认的;推定的","c":[["punitive","intended as punishment","惩罚性的","The state imposed punitive tariffs."],["pejorative","expressing contempt or disapproval","贬义的","'Bureaucrat' is often pejorative."]],"e":["The putative author of the text is unknown to other sources."],"et":"这部文本的推定作者不见于其他史料。","h":"putare = to think (as in compute, repute): the one THOUGHT to be. Reputed leans on reputation; putative on supposition.","lang":"en","cat":"ac","pri":1,"id":"ac-putative"},{"w":"endogenous","p":"en-DOJ-uh-nus","d":"originating from within the system; (econometrics) correlated with the error term","t":"内生的","c":[["exogenous","originating from outside the system","外生的","The oil embargo was an exogenous shock."],["indigenous","native to a place","本土的;原住的","The region has forty indigenous languages."]],"e":["Education is endogenous in the wage equation."],"et":"在工资方程中,教育是内生的。","h":"endo = within; exo = outside; indi-genous = born in the land.","lang":"en","cat":"ac","pri":1,"id":"ac-endogenous"},{"w":"nomothetic","p":"nom-uh-THET-ik","d":"seeking general laws","t":"求普遍规律的","c":[["idiographic","concerned with the unique, particular case","求个案特殊性的","History is often idiographic."],["ideographic","of characters that represent ideas","表意(文字)的","Chinese is not a purely ideographic script."]],"e":["Economics aspires to nomothetic explanation."],"et":"经济学追求求普遍规律式的解释。","h":"nomos = law. IDIO-graphic = one's own (as in idiom); IDEO-graphic = idea-writing.","lang":"en","cat":"ac","pri":1,"id":"ac-nomothetic"},{"w":"emic","p":"EE-mik","d":"from the insider's point of view within a culture","t":"主位的(局内视角)","c":[["etic","from the outside observer's analytic point of view","客位的","The book offers an etic typology of kinship."],["endemic","regularly found in a place or group","地方性的;固有的","Corruption is endemic there."]],"e":["The study gives an emic account of the ritual, in the participants' own terms."],"et":"这项研究以参与者自己的说法,对该仪式做了主位的叙述。","h":"From phonEMIC (meaningful to speakers) against phonETIC (measured from outside).","lang":"en","cat":"ac","pri":1,"id":"ac-emic"},{"w":"synchronic","p":"sin-KRON-ik","d":"concerned with a system at one point in time","t":"共时的","c":[["diachronic","concerned with change over time","历时的","She wrote a diachronic study of tone."],["synchronous","happening at the same time","同步的","The course has synchronous sessions."]],"e":["Saussure favored synchronic over historical analysis."],"et":"索绪尔更看重共时分析,而非历史分析。","h":"syn = together in time (a slice); dia = through time (a film).","lang":"en","cat":"ac","pri":1,"id":"ac-synchronic"},{"w":"metonymy","p":"meh-TON-uh-mee","d":"naming a thing by something associated with it ('the Crown' for the monarchy)","t":"转喻","c":[["synecdoche","naming a whole by a part, or a part by the whole","提喻","'All hands on deck' is synecdoche."],["metaphor","describing one thing as another that it resembles","隐喻","'Time is money' is a metaphor."]],"e":["'The White House said' is a metonymy for the administration."],"et":"'白宫表示'是对美国政府的转喻。","h":"metonymy = association; synecdoche = part and whole; metaphor = resemblance.","lang":"en","cat":"ac","pri":1,"id":"ac-metonymy"},{"w":"aporia","p":"uh-POR-ee-uh","d":"an irresolvable contradiction or impasse in a text or argument","t":"疑难;僵局","c":[["lacuna","a gap or missing portion","空缺;脱漏","There is a lacuna in the manuscript."],["apoplexy","a stroke; extreme anger","中风;暴怒","The review sent him into apoplexy."]],"e":["The dialogue ends in aporia, with no definition agreed."],"et":"这篇对话以疑难告终,没有达成任何定义。","h":"a-poros = no passage. A lacuna is a hole; an aporia is a dead end.","lang":"en","cat":"ac","pri":1,"id":"ac-aporia"},{"w":"teleological","p":"tel-ee-uh-LOJ-ih-kul","d":"explaining by purpose or end goal","t":"目的论的","c":[["theological","relating to the study of God","神学的","It began as a theological dispute."],["deontological","of ethics based on duty and rules, not outcomes","义务论的","Kant offers a deontological objection to lying."]],"e":["The narrative is teleological, treating the nation as history's goal."],"et":"这一叙事是目的论的,把民族国家当作历史的终点。","h":"telos = end, goal (not tele, far). Whig history is the classic teleological sin.","lang":"en","cat":"ac","pri":1,"id":"ac-teleological"},{"w":"contingent","p":"kun-TIN-junt","d":"dependent on something else; not necessary, such that it could have been otherwise","t":"偶然的;取决于","c":[["contiguous","sharing a border; adjacent","毗邻的","The two provinces are contiguous."],["continent","a landmass; (adjective) self-restrained","大陆;有节制的","The plague crossed the continent."]],"e":["The outcome was contingent, not inevitable."],"et":"这一结果是偶然的,而非必然的。","h":"Philosophers set contingent against necessary; contracts make things 'contingent on'.","lang":"en","cat":"ac","pri":1,"id":"ac-contingent"},{"w":"orthogonal","p":"or-THOG-uh-nul","d":"at right angles; statistically independent; (loosely) unrelated to the issue","t":"正交的;互不相干的","c":[["orthodox","conforming to accepted belief","正统的","This is orthodox economics."],["tangential","only slightly connected","离题的;略有关联的","He made a tangential remark."]],"e":["The two dimensions are orthogonal, so one tells us nothing about the other."],"et":"这两个维度是正交的,因此其中一个无法说明另一个。","h":"orthogonal = no overlap at all; tangential = touching at one point.","lang":"en","cat":"ac","pri":1,"id":"ac-orthogonal"},{"w":"stochastic","p":"stuh-KAS-tik","d":"randomly determined; involving probability","t":"随机的","c":[["stoic","enduring hardship without complaint","坚忍的","She gave a stoic response."],["deterministic","fully fixed by prior states, with no randomness","确定性的","The algorithm is deterministic."]],"e":["Training uses stochastic gradient descent."],"et":"训练使用随机梯度下降。","h":"Greek stokhos = aim, guess. Stochastic processes, stochastic parrots.","lang":"en","cat":"ac","pri":1,"id":"ac-stochastic"},{"w":"parsimonious","p":"par-sih-MOH-nee-us","d":"(of a model) explaining much with few assumptions; (of a person) stingy","t":"简约的;吝啬的","c":[["penurious","extremely poor; miserly","赤贫的;吝啬的","He had a penurious upbringing."],["frugal","sparing and economical, in a good sense","节俭的","They kept a frugal household."]],"e":["The more parsimonious model fits the data almost as well."],"et":"更简约的模型对数据的拟合几乎同样好。","h":"Praise for a theory, an insult for a host. Occam's razor is the principle of parsimony.","lang":"en","cat":"ac","pri":1,"id":"ac-parsimonious"},{"w":"abductive","p":"ab-DUK-tiv","d":"reasoning to the best available explanation","t":"溯因的","c":[["inductive","reasoning from particular cases to a general rule","归纳的","Sampling supports inductive inference."],["deductive","reasoning from general premises to a necessary conclusion","演绎的","Geometry proceeds by deductive proof."]],"e":["Diagnosis is abductive: it reasons from symptoms to the likeliest cause."],"et":"诊断是溯因的:它从症状推到最可能的原因。","h":"deduction: must be; induction: usually is; abduction: best explains.","lang":"en","cat":"ac","pri":1,"id":"ac-abductive"},{"w":"impute","p":"im-PYOOT","d":"to attribute (a fault, motive, or act) to someone — often unfairly","c":[["impugn","to attack as false or doubtful (you impugn claims, motives, integrity)"],["imply","to suggest indirectly"]],"e":["The delay was imputed to laziness rather than to the storm.","Never impute to malice what stupidity explains."],"h":"im-PUTE: you PUT blame IN someone's account.","t":"归咎于;归罪","et":"延误被归咎于懒惰,而非那场风暴。","lang":"en","cat":"cf","id":"cf-impute"},{"w":"impugn","p":"im-PYOON","d":"to call into question; attack as false (a claim, someone's honesty)","c":[["impute","to pin blame/credit on someone"],["impinge","to encroach or intrude on"]],"e":["She impugned his motives, hinting he stood to profit."],"h":"pugn = fight (pugnacious): you FIGHT a claim.","t":"质疑;抨击","et":"她质疑他的动机,暗示他能从中获利。","lang":"en","cat":"cf","id":"cf-impugn"},{"w":"proscribe","p":"pro-SKRYBE","d":"to forbid, outlaw, condemn","c":[["prescribe","to order/recommend authoritatively (a doctor prescribes)"]],"e":["The regime proscribed all opposition parties."],"h":"PRO-scribe = PROhibit. Nearly opposite of prescribe.","t":"禁止;取缔","et":"该政权取缔了所有反对党。","lang":"en","cat":"cf","id":"cf-proscribe"},{"w":"demur","p":"dih-MUR","d":"(v.) to object mildly, voice reluctance; (n.) 'without demur' = without objection","c":[["demure","(adj.) modest and reserved, esp. in manner"]],"e":["Asked to sign at once, she demurred, wanting counsel first."],"h":"deMUR = MURmur an objection. Demure has the silent -e, like a quiet person.","t":"婉言反对;迟疑","et":"被要求当场签字时,她表示了迟疑,想先咨询律师。","lang":"en","cat":"cf","id":"cf-demur"},{"w":"supplicant","p":"SUP-lih-kunt","d":"(n.) one who begs humbly, esp. of God or the powerful (also 'suppliant')","c":[["applicant","one who formally applies"],["sycophant","a self-serving flatterer"]],"e":["He came not as a negotiator but as a supplicant, hands open."],"h":"supplicate = fold (plic) under (sub): bent in pleading.","t":"恳求者","et":"他不是作为谈判者前来,而是作为一个双手空张的恳求者。","lang":"en","cat":"cf","id":"cf-supplicant"},{"w":"abet","p":"uh-BET","d":"to help or encourage (usu. wrongdoing) — 'aid and abet'","c":[["abate","to lessen, die down (storms, fury, fevers abate)"]],"e":["The clerk abetted the fraud by shredding the ledgers."],"h":"aBET: you BET on the crime succeeding.","t":"教唆;伙同(作恶)","et":"那名书记员销毁账簿,协同实施了这场欺诈。","lang":"en","cat":"cf","id":"cf-abet"},{"w":"abjure","p":"ab-JOOR","d":"to renounce solemnly, swear off (a belief, a claim)","c":[["adjure","to urge or command earnestly, as under oath"]],"e":["Galileo was forced to abjure heliocentrism."],"h":"ab = away (swear AWAY); ad = toward (urge TOWARD).","t":"发誓放弃","et":"伽利略被迫公开发誓弃绝日心说。","lang":"en","cat":"cf","id":"cf-abjure"},{"w":"abrogate","p":"AB-ruh-gate","d":"to repeal or annul officially (a law, treaty, duty)","c":[["arrogate","to claim/seize without right ('arrogate to oneself')"],["abdicate","to renounce a throne or responsibility"]],"e":["The new government abrogated the trade pact."],"h":"ABrogate ABolishes; ARrogate is ARrogant grabbing.","t":"废除(法令)","et":"新政府废除了那项贸易协定。","lang":"en","cat":"cf","id":"cf-abrogate"},{"w":"adverse","p":"AD-verss","d":"unfavorable, harmful (conditions, effects) — describes things","c":[["averse","reluctant, opposed — describes people: 'averse TO risk'"]],"e":["Adverse weather grounded the flights; he's averse to flying anyway."],"h":"ADverse conditions; people are Averse.","t":"不利的","et":"恶劣天气使航班停飞;况且他本来就怕坐飞机。","lang":"en","cat":"cf","id":"cf-adverse"},{"w":"allude","p":"uh-LOOD","d":"to refer indirectly (allude TO something)","c":[["elude","to escape or evade (the name eludes me)"],["elide","to omit, slur over, or merge (a vowel, a distinction)"]],"e":["She alluded to troubles at home without naming them."],"h":"AL-lude hints AT; E-lude Escapes; E-lide Erases.","t":"暗指;提及","et":"她隐约提到家里的麻烦,却没有点明。","lang":"en","cat":"cf","id":"cf-allude"},{"w":"emend","p":"ih-MEND","d":"to correct a text through scholarly editing","c":[["amend","to improve or formally alter (laws, behavior, soil)"]],"e":["The editor emended the corrupted line from an earlier manuscript."],"h":"Emend is for Editions; amend for laws and ways.","t":"校订(文本)","et":"编者依据更早的抄本校订了那行讹误的文字。","lang":"en","cat":"cf","id":"cf-emend"},{"w":"appraise","p":"uh-PRAYZ","d":"to assess the value or quality of","c":[["apprise","to inform ('apprise someone OF the facts')"]],"e":["The jeweler appraised the ring at two thousand dollars; kindly apprise the owner."],"h":"apprAIse = evaluAte; apprIse = Inform.","t":"估价;评估","et":"珠宝商把这枚戒指估价两千美元;请告知物主。","lang":"en","cat":"cf","id":"cf-appraise"},{"w":"arraign","p":"uh-RAYN","d":"to call before a court to answer charges","c":[["arrange","to put in order, organize"]],"e":["He was arraigned on Monday and pleaded not guilty."],"h":"arRAIGN rhymes with 'complain' — formal accusation.","t":"提审;传讯","et":"他周一被提审,当庭表示不认罪。","lang":"en","cat":"cf","id":"cf-arraign"},{"w":"assay","p":"a-SAY","d":"to test, analyze (metals, ore); to attempt","c":[["essay (v.)","to attempt, try out (literary): 'he essayed a smile'"]],"e":["The lab assayed the ore for gold content."],"h":"Assay = Analyze; essay = attempt (French essayer).","t":"化验;试验","et":"实验室化验了这批矿石的含金量。","lang":"en","cat":"cf","id":"cf-assay"},{"w":"augur","p":"AW-gur","d":"to foretell, be an omen ('augurs well/ill for')","c":[["auger","a drilling tool with a helical bit"],["inaugurate","to begin formally (from augury before office)"]],"e":["Falling orders augur ill for the quarter."],"h":"aUgUr sees the fUtUre; augEr Eats through wood.","t":"预示","et":"订单下滑预示本季度不妙。","lang":"en","cat":"cf","id":"cf-augur"},{"w":"aver","p":
