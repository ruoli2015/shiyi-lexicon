<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>拾遗 Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --paper:#F4F5F2; --ink:#232829; --ink-soft:#5A6260; --line:#DDE0DA; --card:#FFFFFF;
  --en:#16697A; --en-soft:#E3EEF0; --zh:#B5432A; --zh-soft:#F4E7E2;
  --gold:#A8841C; --gold-soft:#F3ECD8;
  --g-again:#B3403A; --g-hard:#B07E24; --g-good:#4A8A57; --g-easy:#3A7CA5;
  --shadow:0 1px 3px rgba(35,40,41,.08), 0 4px 16px rgba(35,40,41,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141718; --ink:#E6E8E4; --ink-soft:#9BA39F; --line:#2C3133; --card:#1D2122;
    --en:#5FB0C2; --en-soft:#1B2E33; --zh:#E08165; --zh-soft:#33221D;
    --gold:#D4B24A; --gold-soft:#2E2917;
    --g-again:#D0665F; --g-hard:#CFA045; --g-good:#6FAE7C; --g-easy:#67A5CC;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"]{
  --paper:#F4F5F2; --ink:#232829; --ink-soft:#5A6260; --line:#DDE0DA; --card:#FFFFFF;
  --en:#16697A; --en-soft:#E3EEF0; --zh:#B5432A; --zh-soft:#F4E7E2;
  --gold:#A8841C; --gold-soft:#F3ECD8;
  --g-again:#B3403A; --g-hard:#B07E24; --g-good:#4A8A57; --g-easy:#3A7CA5;
  --shadow:0 1px 3px rgba(35,40,41,.08), 0 4px 16px rgba(35,40,41,.06);
}
:root[data-theme="dark"]{
  --paper:#141718; --ink:#E6E8E4; --ink-soft:#9BA39F; --line:#2C3133; --card:#1D2122;
  --en:#5FB0C2; --en-soft:#1B2E33; --zh:#E08165; --zh-soft:#33221D;
  --gold:#D4B24A; --gold-soft:#2E2917;
  --g-again:#D0665F; --g-hard:#CFA045; --g-good:#6FAE7C; --g-easy:#67A5CC;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100dvh; -webkit-tap-highlight-color:transparent;
}
.serif{font-family:Palatino,"Palatino Linotype","Book Antiqua",Georgia,"Songti SC","STSong",serif}
.kai{font-family:"Kaiti SC","STKaiti",KaiTi,"Songti SC",serif}
#app{max-width:640px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom));}
header.top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 2px 10px;position:sticky;top:0;background:var(--paper);z-index:5;
}
.brand{font-weight:700;font-size:19px;letter-spacing:.5px}
.brand .lat{font-family:Palatino,Georgia,serif;font-weight:400;font-style:italic;color:var(--ink-soft);font-size:15px;margin-left:4px}
.topstats{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-soft);background:var(--card)}
.pill b{color:var(--ink);font-weight:600}
.pill.streak b{color:var(--gold)}
.ring{width:30px;height:30px;transform:rotate(-90deg)}
.ring .bg{stroke:var(--line);fill:none}
.ring .fg{stroke:var(--gold);fill:none;stroke-linecap:round;transition:stroke-dashoffset .4s}
main{display:block}
h2.viewtitle{font-size:14px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-soft);font-weight:600;margin:14px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
/* ---- dashboard ---- */
.dash{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.duecard{padding:22px 20px;text-align:center}
.duecard .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.duecard .sub{color:var(--ink-soft);font-size:14px;margin-top:4px}
.btnrow{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:none;border-radius:12px;color:var(--ink)}
button:focus-visible{outline:2px solid var(--en);outline-offset:2px}
.btn{padding:12px 22px;font-weight:600;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.small{padding:8px 14px;font-size:13.5px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{padding:14px 16px}
.mini .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mini .l{font-size:12.5px;color:var(--ink-soft)}
/* ---- review card ---- */
.rev{margin-top:8px;padding:22px 20px;min-height:340px;display:flex;flex-direction:column}
.rev .meta{display:flex;gap:6px;align-items:center;margin-bottom:14px}
.chip{font-size:11.5px;padding:2.5px 9px;border-radius:999px;font-weight:600;letter-spacing:.04em}
.chip.en{background:var(--en-soft);color:var(--en)}
.chip.zh{background:var(--zh-soft);color:var(--zh)}
.chip.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-weight:500}
.rev .word{font-size:34px;line-height:1.2;font-weight:600;text-wrap:balance;margin:6px 0 2px}
.rev .word.zh1{font-size:76px;font-weight:400;text-align:center;margin:18px 0 6px}
.rev .cue{font-size:22px;line-height:1.6;margin:10px 0}
.rev .cue .blank{color:var(--zh);font-weight:600}
.rev .pron{color:var(--ink-soft);font-size:16px;margin:2px 0 10px;font-style:italic}
.rev .pron.zh{font-style:normal;font-weight:600;color:var(--zh);font-size:20px}
.rev .def{font-size:17px;line-height:1.55;margin:6px 0}
.trans{color:var(--zh);font-weight:600;font-size:15.5px;margin:0 0 8px}
.btr{color:var(--zh);font-weight:500}
.rev .ans .word.zh1{margin:6px 0}
.contra{margin:12px 0 4px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.contra .row{display:flex;gap:12px;padding:9px 12px;font-size:14.5px;line-height:1.45}
.contra .row+.row{border-top:1px solid var(--line)}
.contra .row.self{background:var(--en-soft)}
.contra .cw{font-weight:700;min-width:86px;flex-shrink:0;font-family:Palatino,Georgia,serif}
.contra .cg{color:var(--ink-soft)}
.exs{margin:10px 0 0;padding:0 0 0 0;list-style:none}
.exs li{font-size:15px;line-height:1.55;color:var(--ink-soft);padding-left:14px;position:relative;margin-top:6px}
.exs li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:2px;background:var(--ink-soft);opacity:.6}
.hook{margin-top:12px;padding:10px 12px;background:var(--gold-soft);border-radius:10px;font-size:14px;line-height:1.5;color:var(--ink)}
.hook b{color:var(--gold)}
.showbar{margin-top:auto;padding-top:18px}
.showbar .btn{width:100%;padding:15px}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto;padding-top:18px}
.grades button{padding:11px 4px 9px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.grades .gl{font-weight:700;font-size:14.5px}
.grades .gi{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.grades .b0 .gl{color:var(--g-again)} .grades .b1 .gl{color:var(--g-hard)}
.grades .b2 .gl{color:var(--g-good)} .grades .b3 .gl{color:var(--g-easy)}
.grades .b0{border-color:color-mix(in srgb,var(--g-again) 45%,var(--line))}
.grades .b1{border-color:color-mix(in srgb,var(--g-hard) 45%,var(--line))}
.grades .b2{border-color:color-mix(in srgb,var(--g-good) 45%,var(--line))}
.grades .b3{border-color:color-mix(in srgb,var(--g-easy) 45%,var(--line))}
.sessionbar{display:flex;justify-content:space-between;align-items:center;margin:10px 2px 0;font-size:12.5px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
/* ---- quiz ---- */
.qprompt{font-size:19px;line-height:1.65;margin:10px 0 2px}
.qprompt .bl{color:var(--en);font-weight:700;letter-spacing:1px}
.qsub{font-size:13px;color:var(--ink-soft);margin-top:6px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opts button{padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;text-align:left;line-height:1.4;color:var(--ink)}
.opts button.serifopt{font-family:Palatino,"Palatino Linotype",Georgia,serif;font-size:17px}
.opts button.right{border-color:var(--g-good);background:color-mix(in srgb,var(--g-good) 14%,var(--card));font-weight:700}
.opts button.wrong{border-color:var(--g-again);background:color-mix(in srgb,var(--g-again) 14%,var(--card))}
.opts button:disabled{cursor:default}
.verdict{font-weight:700;margin-top:14px;font-size:15px}
.verdict.ok{color:var(--g-good)} .verdict.no{color:var(--g-again)}
.combo{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
.combo.bump{display:inline-block;animation:bump .3s}
.contbar{margin-top:16px}
.contbar .btn{width:100%;padding:14px}
/* ---- seals ---- */
.sealgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.sealtile{padding:14px 10px;text-align:center;cursor:pointer}
.seal{width:76px;height:76px;margin:0 auto 8px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:"Kaiti SC","STKaiti",KaiTi,serif;font-size:24px;line-height:1.12;letter-spacing:1px;writing-mode:vertical-rl}
.seal.done{background:var(--zh);color:#FFF7F0;transform:rotate(-3deg);box-shadow:0 3px 10px rgba(181,67,42,.3)}
.seal.todo{border:2px dashed var(--line);color:var(--ink-soft)}
.sealtile .sn{font-weight:700;font-size:14.5px}
.sealtile .se{font-size:11px;color:var(--ink-soft);font-style:italic}
.sealtile .sp{font-size:12px;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.members .m{font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft)}
.members .m.got{background:var(--zh-soft);color:var(--zh);border-color:transparent;font-weight:600}
.members .m.mid{border-color:var(--gold);color:var(--gold)}
.sdesc{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5}
.celebrate{text-align:center;padding:44px 20px;margin-top:8px}
.celebrate .seal{width:118px;height:118px;font-size:38px;margin-bottom:16px;animation:stamp .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes stamp{0%{transform:scale(2.1) rotate(6deg);opacity:0}60%{transform:scale(.94) rotate(-5deg);opacity:1}100%{transform:scale(1) rotate(-3deg)}}
@media (prefers-reduced-motion: reduce){ .celebrate .seal{animation:none} }
.speakbtn{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin-left:8px}
.speakbtn svg{width:16px;height:16px;fill:var(--ink-soft)}
canvas.pad{width:100%;height:230px;border:1.5px dashed var(--line);border-radius:12px;background:var(--card);touch-action:none;display:block;margin:8px 0}
.padrow{display:flex;gap:8px}
/* ---- radio ---- */
.radio{padding:20px;margin-top:8px;text-align:center}
.radio select,.radio input[type=range]{font:inherit}
.rctl{display:flex;gap:10px;justify-content:center;align-items:center;margin:18px 0 6px}
.playbtn{width:74px;height:74px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:26px;display:flex;align-items:center;justify-content:center}
.skipbtn{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:17px}
.nowplaying{margin-top:16px;min-height:120px}
.nowplaying .npw{font-size:30px;font-weight:600;margin:4px 0}
.nowplaying .npd{color:var(--ink-soft);font-size:14.5px;line-height:1.5;max-width:46ch;margin:0 auto}
.selrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.raterow{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;font-size:13px;color:var(--ink-soft)}
input[type=range]{accent-color:var(--en)}
.radionote{font-size:12.5px;color:var(--ink-soft);margin-top:14px;line-height:1.5}
/* ---- browse ---- */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:8px}
.search:focus-visible{outline:2px solid var(--en)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-soft)}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.blist{display:flex;flex-direction:column;gap:8px}
.bitem{padding:12px 14px;cursor:pointer}
.bitem .bw{font-weight:600;font-size:16.5px}
.bitem .bd{color:var(--ink-soft);font-size:13.5px;margin-top:2px;line-height:1.45}
.bitem .full{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.bstat{font-size:11.5px;color:var(--ink-soft);float:right;font-variant-numeric:tabular-nums}
.loadmore{margin:12px auto;display:block}
/* ---- add ---- */
form.addf{display:flex;flex-direction:column;gap:10px;margin-top:8px}
form.addf label{font-size:12.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
form.addf input,form.addf textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
form.addf textarea{min-height:64px;resize:vertical}
form.addf input:focus-visible,form.addf textarea:focus-visible{outline:2px solid var(--en)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:10px;background:var(--card);color:var(--ink-soft);border-radius:0}
.seg button.on{background:var(--ink);color:var(--paper)}
/* ---- stats ---- */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:3px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:2.5px;background:var(--line);display:block}
.heat i.h1{background:color-mix(in srgb,var(--gold) 35%,var(--line))}
.heat i.h2{background:color-mix(in srgb,var(--gold) 65%,var(--line))}
.heat i.h3{background:var(--gold)}
.pbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;border-radius:99px}
.prow{padding:12px 14px}
.prow .pl{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.prow .pl b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-soft)}
.settings{margin-top:16px;padding:16px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.setrow:last-child{border-bottom:none}
.setrow input[type=number]{width:70px;padding:7px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;text-align:center}
textarea.io{width:100%;min-height:80px;font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
/* ---- tabs ---- */
nav.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:10;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 7px;border-radius:10px;color:var(--ink-soft);font-size:10.5px;font-weight:600;letter-spacing:.02em}
nav.tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--ink-soft);padding:44px 20px;font-size:15px;line-height:1.6}
.donebox{text-align:center;padding:44px 20px}
.donebox .dt{font-size:26px;font-weight:700;margin-bottom:6px}
.donebox .ds{color:var(--ink-soft);line-height:1.6}
@media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important} }
@media (max-width:420px){ .rev .word{font-size:29px} .heat{grid-template-columns:repeat(26,1fr)} }
</style></head><body>
<div id="app">
  <header class="top">

","id":"ra-chthonic"},{"w":"sidereal","p":"sy-DEER-ee-ul","d":"of the stars; measured by the stars (sidereal day)","e":["A sidereal day is four minutes short of a solar one."],"h":"sidus = star (consider = consult the stars).","t":"恒星的","lang":"en","cat":"ra","id":"ra-sidereal"},{"w":"empyrean","p":"em-py-REE-un","d":"the highest heaven; the sky's vault; celestially exalted","e":["The lark vanished into the empyrean."],"h":"empyros = in fire — the sphere of pure flame.","t":"九霄;苍穹","lang":"en","cat":"ra","id":"ra-empyrean"},{"w":"friable","p":"FRY-uh-bul","d":"easily crumbled (soil, rock, asbestos)","e":["Friable loam is a gardener's dream and asbestos's danger."],"h":"friare = crumble. Not 'fryable'.","t":"松脆易碎的","lang":"en","cat":"ra","id":"ra-friable"},{"w":"brackish","p":"BRAK-ish","d":"slightly salty (water); unpleasantly stale","e":["Brackish lagoons where the river meets the sea."],"h":"Dutch brak = salty.","t":"半咸的","lang":"en","cat":"ra","id":"ra-brackish"},{"w":"mottled","p":"MOT-uld","d":"marked with irregular patches of color","e":["Mottled bananas; light mottled by leaves."],"h":"mote-speckled.","t":"斑驳的","lang":"en","cat":"ra","id":"ra-mottled"},{"w":"dappled","p":"DAP-uld","d":"marked with soft spots of light or color (dappled shade, a dappled grey horse)","e":["Dappled sunlight moved across the path."],"h":"Hopkins: 'Glory be to God for dappled things.'","t":"光影斑驳的","lang":"en","cat":"ra","id":"ra-dappled"},{"w":"piebald","p":"PY-bawld","d":"with large black-and-white patches (horses)","e":["A piebald pony grazed the verge."],"h":"magPIE + BALD (white patch) = magpie-colored.","t":"黑白花斑的","lang":"en","cat":"ra","id":"ra-piebald"},{"w":"brindled","p":"BRIN-duld","d":"streaked with darker color (dogs, cats, cattle)","e":["A brindled boxer with tiger-faint stripes."],"h":"Brindle = the tawny tiger-streak coat.","t":"虎斑纹的","lang":"en","cat":"ra","id":"ra-brindled"},{"w":"roan","p":"ROHN","d":"(of horses) coat evenly mixed with white hairs (strawberry roa /* ================= state ================= */
const LS = "lexicon.v1";
let DIRTY=false;
let S = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS));
    if(s && s.srs){ s.seals=s.seals||{}; s.bestCombo=s.bestCombo||0; s.retired=s.retired||{}; s.deleted=s.deleted||{}; return s; } }catch(e){}
  return { srs:{}, log:{}, xp:0, custom:[], seals:{}, bestCombo:0, retired:{}, deleted:{}, set:{ newPerDay:15, dailyGoal:20, rate:1.0, enVoice:"", zhVoice:"" } };
}
function save(){ localStorage.setItem(LS, JSON.stringify(S)); DIRTY=true; }
function isRet(id){ return S.retired[id]>0; }
function retireCard(id){ S.retired[id]=Math.max(1,today()); save(); checkSeals(); schedulePush(); }
function restoreCard(id){ S.retired[id]=-Math.max(1,today()); save(); schedulePush(); }
function deleteCustom(id){
  S.deleted[id]=Math.max(1,today());
  S.custom=S.custom.filter(c=>c.id!==id);
  delete S.srs[id]; delete S.retired[id];
  save(); schedulePush();
}
function today(){ const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000); }
function dayLog(d){ const k=String(d===undefined?today():d); if(!S.log[k]) S.log[k]={r:0,n:0}; return S.log[k]; }
function allCards(){ return DECK.concat(S.custom); }
const byId = () => { const m={}; for(const c of allCards()) m[c.id]=c; return m; };
/* ================= srs (SM-2 variant) ================= */
function srsOf(id){ if(!S.srs[id]) S.srs[id]={ef:2.5,ivl:0,reps:0,due:0,lapses:0}; return S.srs[id]; }
function preview(id,g){
  const r=Object.assign({},S.srs[id]||{ef:2.5,ivl:0,reps:0});
  const iv=nextIvl(r,g); return iv===0?"稍后":fmtIvl(iv);
}
function nextIvl(r,g){
  if(g===0) return 0;
  if(r.reps===0||r.ivl===0){ return g===1?1: g===2?1:3; }
  if(g===1) return Math.max(r.ivl+1, Math.round(r.ivl*1.2));
  if(g===2) return r.ivl===1?3:Math.round(r.ivl*r.ef);
  return Math.max(r.ivl===1?4:0, Math.round(r.ivl*r.ef*1.35));
}
function grade(id,g){
  const r=srsOf(id), iv=nextIvl(r,g);
  if(g===0){ r.lapses++; r.reps=0; r.ivl=0; r.due=today(); r.ef=Math.max(1.3,r.ef-0.2); }
  else{
    if(g===1) r.ef=Math.max(1.3,r.ef-0.15);
    if(g===3) r.ef=Math.min(2.8,r.ef+0.12);
    r.reps++; r.ivl=iv; r.due=today()+iv;
  }
  dayLog().r++; S.xp += (g===0?1:2);

}
function fmtIvl(d){ if(d<1)return"今天"; if(d<30)return d+"天"; if(d<365)return (d/30).toFixed(1).replace(/\.0$/,"")+"月"; return (d/365).toFixed(1).replace(/\.0$/,"")+"年"; }
/* queue */
function dueCards(){ const t=today(); return allCards().filter(c=>{if(isRet(c.id))return false; const r=S.srs[c.id]; return r && r.reps>0 && r.due<=t;}); }
function relearnCards(){ const t=today(); return allCards().filter(c=>{if(isRet(c.id))return false; const r=S.srs[c.id]; return r && r.reps===0 && r.lapses>0 && r.due<=t;}); }
function newCards(){ return allCards().filter(c=>!S.srs[c.id]&&!isRet(c.id)); }
function newBudget(){ return Math.max(0, S.set.newPerDay - dayLog().n); }
function buildQueue(limit){
  let q = shuffle(dueCards()).concat(shuffle(relearnCards()));
  const nb = newBudget();
  if(nb>0){ q = q.concat(interleave(newCards(), nb)); }
  if(limit) q = q.slice(0,limit);
  return q.map(c=>c.id);
}
function interleave(cards,n){
  const en=cards.filter(c=>c.lang==="en"), zh=cards.filter(c=>c.lang==="zh"), out=[];
  let i=0,j=0;
  while(out.length<n && (i<en.length||j<zh.length)){
    if(i<en.length) out.push(en[i++]);
    if(out.length<n && j<zh.length) out.push(zh[j++]);
  }
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

function levelOf(xp){ let li=0; for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i][0]) li=i; } return li; }

}

function mergeData(d){
  for(const k in (d.srs||{})){ const a=S.srs[k],b=d.srs[k];
    if(!a || b.reps>a.reps || (b.reps===a.reps&&b.due>a.due)) S.srs[k]=b; }
  for(const k in (d.log||{})){ const a=dayLogK(k),b=d.log[k]; a.r=Math.max(a.r,b.r||0); a.n=Math.max(a.n,b.n||0); }
  S.xp=Math.max(S.xp,d.xp||0);
  S.bestCombo=Math.max(S.bestCombo||0,d.bestCombo||0);
  S.seals=Object.assign({},d.seals||{},S.seals);
  for(const k in (d.retired||{})){ const a=S.retired[k],b=d.retired[k];
    if(a===undefined || Math.abs(b)>Math.abs(a)) S.retired[k]=b; }
  S.deleted=Object.assign({},S.deleted,d.deleted||{});
  const have=new Set(S.custom.map(c=>c.id));
  for(const c of (d.custom||[])) if(!have.has(c.id)) S.custom.push(c);

function pickVoice(lang){
  const pref = lang==="en"?S.set.enVoice:S.set.zhVoice;
  if(pref){ const v=VOICES.find(v=>v.name===pref); if(v) return v; }
  const want = lang==="en"?"en":"zh";
  return VOICES.find(v=>v.lang.toLowerCase().startsWith(want+"-")||v.lang.toLowerCase()===want) || null;
}
function speak(text,lang,rate){
  return new Promise(res=>{
    if(!("speechSynthesis" in window)||!text){ res(); return; }
    const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(lang); if(v) u.voice=v;
    u.lang = lang==="en"?"en-US":"zh-CN";
    u.rate = rate||S.set.rate||1;
    u.onend=()=>res(); u.onerror=()=>res();
    speechSynthesis.speak(u);
  });
}

const R = { on:false, list:[], idx:0, gen:0 };
function radioSegments(c){
  const segs=[];
  if(c.lang==="en"){
    segs.push([c.w,"en"]);
    segs.push([c.d,"en"]);
    if(c.t) segs.push([c.t,"zh"]);
    if(c.c) for(const [w,g] of c.c) segs.push(["Compare: "+w+" — "+g,"en"]);
    if(c.e&&c.e[0]) segs.push(["Example: "+c.e[0],"en"]);
  }else{
    segs.push([c.w,"zh"]);
    segs.push([(c.p?("读音:"+c.w+"。"):"")+"意思是:"+c.d,"zh"]);
    if(c.e&&c.e[0]) segs.push(["例如:"+c.e[0],"zh"]);
    if(c.h) segs.push(["记法:"+c.h,"zh"]);
  }
  return segs;
}
async function radioLoop(){
  while(R.on && R.list.length){
    if(R.idx>=R.list.length) R.idx=0; // loop
    const c=R.list[R.idx];
    const np=document.getElementById("npBox");
    if(np){ np.innerHTML =
      '<div class="chip '+c.lang+'" style="display:inline-block">'+(c.lang==="en"?"EN":"中")+'</div>'+
      '<div class="npw '+(c.lang==="zh"?"kai":"serif")+'">'+esc(c.w)+'</div>'+
      (c.p?'<div class="npd" style="margin-bottom:4px">'+esc(c.p)+'</div>':"")+
      '<div class="npd">'+esc(c.d)+'</div>'; }
    const gen=R.gen;
    for(const [t,l] of radioSegments(c)){
      if(!R.on) return;
      if(R.gen!==gen) break;
      await speak(t,l);
      if(!R.on) return;
      if(R.gen!==gen) break;
      await new Promise(r=>setTimeout(r,450));
    }
    if(R.gen===gen){ await new Promise(r=>setTimeout(r,800)); R.idx++; }
  }
  const b=document.getElementById("playBtn"); if(b) b.textContent="▶";
}

function pickN(pool,n,exclude){
  const out=[], used=new Set(exclude||[]);
  for(const x of shuffle(pool)){
    if(out.length>=n) break;
    if(x==null||x===""||used.has(x)) continue;
    used.add(x); out.push(x);
  }
  return out;
}
function blankOut(sentence,word){
  const stem=word.toLowerCase().replace(/(e|y)$/,"");
  if(stem.length<3) return null;
  const parts=sentence.split(/(\s+)/);
  for(let i=0;i<parts.length;i++){
    const clean=parts[i].replace(/[^a-zA-Z'-]/g,"").toLowerCase();
    if(clean && (clean===word.toLowerCase()||(clean.startsWith(stem)&&clean.length<=word.length+3))){
      parts[i]=parts[i].replace(/[a-zA-Z'-]+/,"______");
      return parts.join("");
    }
  }
  return null;
}
function qConfusable(c){
  let sent=null;
  for(const ex of (c.e||[])){ const b=blankOut(ex,c.w); if(b){ sent=b; break; } }
  let opts=[c.w].concat((c.c||[]).map(x=>x[0]));
  if(opts.length<3) opts=opts.concat(pickN(DECK.filter(x=>x.cat==="cf").map(x=>x.w),3-opts.length,opts));
  opts=shuffle(opts.slice(0,4));
  if(sent){
    const ph=esc(sent).replace(/_{3,}/,'<span class="bl">______</span>');
    return {prompt:'<div class="qprompt serif">'+ph+'</div><div class="qsub">哪个词填进去?</div>',opts,answer:c.w,cls:"serifopt"};
  }
  return {prompt:'<div class="qprompt">'+esc(c.d)+'</div><div class="qsub">哪个词?</div>',opts,answer:c.w,cls:"serifopt"};
}
function qMeaning(c){
  const pool=DECK.filter(x=>x.cat===c.cat&&x.id!==c.id&&x.t);
  if(!c.t||pool.length<3) return null;
  if(Math.random()<0.5){
    const opts=shuffle([c.t].concat(pickN(pool.map(x=>x.t),3,[c.t])));
    return {prompt:'<div class="word serif" style="font-size:30px;margin:6px 0 0">'+esc(c.w)+'</div>'+(c.p?'<div class="qsub">'+esc(c.p)+'</div>':"")+'<div class="qsub">选出释义</div>',opts,answer:c.t};
  }
  const opts=shuffle([c.w].concat(pickN(pool.map(x=>x.w),3,[c.w])));
  return {prompt:'<div class="qprompt"><span style="color:var(--zh);font-weight:600;font-size:22px">'+esc(c.t)+'</span></div><div class="qsub">选出单词</div>',opts,answer:c.w,cls:"serifopt"};
}
const IDSTOP=new Set(["the","with","under","down","someone's","your","out","into","over","that"]);
function idiomKey(w){
  const ws=w.split(" ").filter(x=>x.length>3&&!IDSTOP.has(x.toLowerCase()));
  if(!ws.length) return null;
  return ws.sort((a,b)=>b.length-a.length)[0];
}
function qIdiom(c){
  const key=idiomKey(c.w);
  if(!key||key===c.w){
    const pool=DECK.filter(x=>x.cat==="id"&&x.id!==c.id&&x.t);
    if(!c.t||pool.length<3) return null;
    const opts=shuffle([c.t].concat(pickN(pool.map(x=>x.t),3,[c.t])));
    return {prompt:'<div class="word serif" style="font-size:25px;margin:6px 0">'+esc(c.w)+'</div><div class="qsub">什么意思?</div>',opts,answer:c.t};
  }
  const blanked=esc(c.w.replace(key,"______")).replace(/_{3,}/,'<span class="bl">______</span>');
  const pool=DECK.filter(x=>x.cat==="id"&&x.id!==c.id).map(x=>idiomKey(x.w)).filter(k=>k&&!k.includes(" "));
  const opts=shuffle([key].concat(pickN(pool,3,[key])));
  return {prompt:'<div class="qprompt serif">'+blanked+'</div><div class="qsub" style="color:var(--zh)">'+esc(c.t||"")+'</div><div class="qsub">补全习语</div>',opts,answer:key,cls:"serifopt"};
}
function qHanzi(c){
  const pool=DECK.filter(x=>x.cat==="hz"&&x.p!==c.p).map(x=>x.p);
  if(pool.length<3) return null;

function poolWords(c){
  let pool=allCards().filter(x=>x.lang===c.lang&&x.id!==c.id&&x.cat!=="id").map(x=>x.w);
  if(c.lang==="zh"){
    const near=pool.filter(w=>Math.abs(w.length-c.w.length)<=1);
    if(near.length>=3) pool=near;
  }
  return pool;
}
function qCustom(c){
  const pool=poolWords(c);
  if(pool.length<3) return null;
  for(const ex of (c.e||[])){
    let blanked=null;
    if(c.lang==="en"){ blanked=blankOut(ex,c.w); }
    else if(c.w && ex.includes(c.w)){ blanked=ex.replace(c.w,"______"); }
    if(blanked){
      const opts=shuffle([c.w].concat(pickN(pool,3,[c.w])));
      return {prompt:'<div class="qprompt'+(c.lang==="en"?" serif":"")+'">'+esc(blanked).replace(/_{3,}/,'<span class="bl">______</span>')+'</div><div class="qsub">填哪个词?</div>',opts,answer:c.w,cls:c.lang==="en"?"serifopt":""};
    }
  }
  if(!c.d) return null;
  const opts=shuffle([c.w].concat(pickN(pool,3,[c.w])));
  return {prompt:'<div class="qprompt">'+esc(c.d)+'</div><div class="qsub">选出对应的词</div>',opts,answer:c.w,cls:c.lang==="en"?"serifopt":""};
}
function questionFor(c){
  if(S.set.classic) return null;
  try{
    if(c.cat==="cf") return qConfusable(c);
    if(c.cat==="hz") return qHanzi(c);
    if(c.cat==="id") return qIdiom(c);
    if(c.cat==="ra"||c.cat==="ev") return qMeaning(c);
    if(c.cat==="cu") return qCustom(c);
  }catch(e){}
  return null;
}

function comboGain(ok){

    SESSION.bestCombo=Math.max(SESSION.bestCombo,SESSION.combo);
    if(SESSION.combo>(S.bestCombo||0)) S.bestCombo=SESSION.combo;
    S.xp+=Math.min(4,Math.floor(SESSION.combo/3));
  }else{ SESSION.combo=0; SESSION.wrong++; }
  save();
}
let PENDING=[];
function checkSeals(){
  for(const st of SETS){
    if(S.seals[st.id]) continue;
    if(st.members.every(id=>{if(isRet(id))return true; const r=S.srs[id];return r&&r.ivl>=10;})){
      S.seals[st.id]=today(); S.xp+=50; PENDING.push(st);
    }
  }
  if(PENDING.length) save();
}

      '<div style="text-align:center;margin-top:8px"><button class="btn small" id="retireBtn">太熟了 · 退休此词</button></div>');
    const s=document.getElementById("spk"); if(s) s.onclick=e=>{e.stopPropagation(); speakCard(c);};

/* handwriting pad */
function initPad(){
  const cv=document.getElementById("pad"); if(!cv) return;
  const dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.lineWidth=4; ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle=getComputedStyle(document.body).color;
  let draw=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left,e.clientY-r.top];};
  cv.onpointerdown=e=>{draw=true;[px,py]=pos(e);cv.setPointerCapture(e.pointerId);};
  cv.onpointermove=e=>{if(!draw)return;const[x,y]=pos(e);ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();[px,py]=[x,y];};
  cv.onpointerup=cv.onpointercancel=()=>{draw=false;};
  const cl=document.getElementById("padClear"); if(cl) cl.onclick=()=>ctx.clearRect(0,0,w,h);
}

  '<div class="statgrid">'+
  '<div class="card mini"><div class="n" style="color:var(--gold)">'+streak()+'</div><div class="l">连续天数</div></div>'+
  '<div class="card mini"><div class="n">'+S.xp+'</div><div class="l">XP · '+esc(LEVELS[li][1])+(nxt?' → '+nxt[0]:"")+'</div></div>'+
  '<div class="card mini"><div class="n">'+mastered+'</div><div class="l">已掌握(间隔≥21天)</div></div>'+
  '<div class="card mini"><div class="n">'+learning+'</div><div class="l">复习中</div></div>'+
  '<div class="card mini"><div class="n">×'+(S.bestCombo||0)+'</div><div class="l">连击纪录</div></div>'+
  '<div class="card mini"><div class="n">'+SETS.filter(s=>S.seals[s.id]).length+'<span style="font-size:14px;color:var(--ink-soft)"> / '+SETS.length+'</span></div><div class="l">印章 → 见「收藏」</div></div>'+
  '</div>'+
  '<div class="card" style="padding:14px;margin-top:10px"><div style="font-size:13px;color:var(--ink-soft);margin-bottom:2px">最近 26 周</div><div class="heat">'+heat+'</div></div>'+
  '<div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">'+catrows+'</div>'+
  '<div class="card settings"><div style="font-weight:700;margin-bottom:4px">设置</div>'+
  '<div class="setrow"><span>每日新词上限</span><input type="number" id="setNew" min="0" max="99" value="'+S.set.newPerDay+'"></div>'+
  '<div class="setrow"><span>每日目标(张)</span><input type="number" id="setGoal" min="5" max="200" value="'+S.set.dailyGoal+'"></div>'+
  '<div class="setrow"><span>经典翻卡模式(关闭选择题)</span><input type="checkbox" id="setClassic" style="width:auto" '+(S.set.classic?"checked":"")+'></div>'+
  '<div class="setrow"><span>英文语音</span><select id="setEnV"></select></div>'+
  '<div class="setrow"><span>中文语音</span><select id="setZhV"></select></div>'+
  '<div class="setrow" style="flex-direction:column;align-items:stretch"><span style="margin-bottom:6px">自动同步(GitHub Gist)· '+(S.set.ghToken?('<b style="color:var(--g-good)">已连接</b>'+(S.set.lastSync?' · 上次同步 '+new Date(S.set.lastSync).toLocaleString():"")):"未连接")+'</span>'+
  (S.set.ghToken?
   '<div class="btnrow" style="justify-content:flex-start"><button class="btn small" id="syncNowBtn">立即同步</button><button class="btn small" id="syncOffBtn">断开</button></div>':
   '<input id="ghTok" type="password" autocomplete="off" placeholder="粘贴 GitHub token(仅需 gist 权限)" style="padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit">'+
   '<div class="btnrow" style="justify-content:flex-start;margin-top:8px"><button class="btn small" id="syncOnBtn">连接并同步</button></div>'+
   '<div style="font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:6px">进度存到你自己的私密 Gist,每台设备粘贴一次同一个 token 即可。token 只保存在本机浏览器,创建方法见 README。</div>')+
  '</div>'+
  '<div class="setrow" style="flex-direction:column;align-items:stretch"><span style="margin-bottom:6px">手动备份:导出进度(复制到另一台设备导入)</span>'+
  '<textarea class="io" id="ioBox" placeholder="点「导出」生成,或粘贴后点「导入」"></textarea>'+
  '<div class="btnrow" style="justify-content:flex-start"><button class="btn small" id="expBtn">导出</button><button class="btn small" id="impBtn">导入</button><button class="btn small" id="cpBtn">复制</button></div></div>'+
  '<div class="setrow"><span style="color:var(--g-again)">清空全部进度</span><button class="btn small" id="rstBtn">重置</button></div>'+
  '</div>';
  const sn=document.getElementById("setNew"), sg=document.getElementById("setGoal");
  sn.onchange=()=>{S.set.newPerDay=Math.max(0,+sn.value||0);save();};
  sg.onchange=()=>{S.set.dailyGoal=Math.max(1,+sg.value||20);save();refreshTop();};
  document.getElementById("setClassic").onchange=e=>{S.set.classic=e.target.checked;save();};
  const fill=(sel,lang,cur)=>{
    const vs=VOICES.filter(v=>v.lang.toLowerCase().startsWith(lang));
    sel.innerHTML='<option value="">自动</option>'+vs.map(v=>'<option '+(v.name===cur?"selected":"")+' value="'+esc(v.name)+'">'+esc(v.name)+'</option>').join("");
  };
  fill(document.getElementById("setEnV"),"en",S.set.enVoice);
  fill(document.getElementById("setZhV"),"zh",S.set.zhVoice);
  document.getElementById("setEnV").onchange=e=>{S.set.enVoice=e.target.value;save();};
  document.getElementById("setZhV").onchange=e=>{S.set.zhVoice=e.target.value;save();};
  const sOn=document.getElementById("syncOnBtn");
  if(sOn) sOn.onclick=()=>{
    const tk=document.getElementById("ghTok").value.trim();
    if(!tk){ toast("先粘贴 token"); return; }
    S.set.ghToken=tk; save();
    toast("连接中…");
    syncNow(true);
  };
  const sNow=document.getElementById("syncNowBtn");
  if(sNow) sNow.onclick=()=>syncNow(true);
  const sOff=document.getElementById("syncOffBtn");
  if(sOff) sOff.onclick=()=>{ delete S.set.ghToken; save(); toast("已断开(Gist 数据保留)"); vStats(); };
  document.getElementById("expBtn").onclick=()=>{
    const st=Object.assign({},S.set); delete st.ghToken;
    const data=Object.assign(payload(),{set:st});
    document.getElementById("ioBox").value="LEX1."+btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    toast("已生成,点「复制」后到另一台设备粘贴导入");
  };
  document.getElementById("cpBtn").onclick=async()=>{
    const v=document.getElementById("ioBox").value; if(!v){toast("先点「导出」");return;}
    try{ await navigator.clipboard.writeText(v); toast("已复制"); }catch(e){ toast("请手动全选复制"); }
  };
  document.getElementById("impBtn").onclick=()=>{
    let v=document.getElementById("ioBox").value.trim();
    if(!v.startsWith("LEX1.")){ toast("格式不对,应以 LEX1. 开头"); return; }
    try{
      const d=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
      mergeData(d);
      schedulePush(); refreshTop(); toast("导入完成"); vStats();
    }catch(e){ toast("导入失败:数据无法解析"); }
  };
  document.getElementById("rstBtn").onclick=()=>{
    if(confirm("确定清空全部学习进度?此操作不可撤销。")){ localStorage.removeItem(LS); S=load(); save(); refreshTop(); vReview(); go("review"); toast("已重置"); }
  };
}
function dayLogK(k){ if(!S.log[k]) S.log[k]={r:0,n:0}; return S.log[k]; }
/* ================= init ================= */
renderTabs(); refreshTop(); vReview();
if(S.set.ghToken) syncNow(false);
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"&&DIRTY&&S.set.ghToken) syncNow(false);
});
</script>
</body></html>
